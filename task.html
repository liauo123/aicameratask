<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>教師平台｜教學與評量列表</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--b:#2563eb;--r:#dc2626;--m:#64748b;--surface:#fff;--surface-border:#dbe4ee;--teaching-bg:#eff6ff;--teaching-border:#93c5fd;--evaluation-bg:#ecfdf5;--evaluation-border:#86efac;--advanced-bg:#effcf9;--advanced-border:#5eead4;--game-bg:#faf5ff;--game-border:#c4b5fd;--click-bg:#fff8ed;--click-border:#fbbf24;--hanzi-bg:#fff1f2;--hanzi-border:#fb7185}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#f6f9fd 0,#edf3f9 100%);font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;color:#172033;min-height:100vh}
header{background:rgba(255,255,255,.96);border-bottom:1px solid #dbe5f0;box-shadow:0 4px 18px rgba(15,23,42,.07);padding:13px 20px;position:sticky;top:0;z-index:20;backdrop-filter:blur(10px)}
.head{max-width:1180px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:12px}.brandMark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;font-size:21px;font-weight:900;box-shadow:0 7px 18px rgba(37,99,235,.24)}
h1{margin:0;color:#17376b;font-size:22px;letter-spacing:.04em}
main{max-width:1180px;margin:auto;padding:22px 18px 40px}
.card{background:var(--surface);border:1px solid var(--surface-border);border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 8px 24px rgba(15,23,42,.065)}
button,.navBtn{border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .15s,filter .15s}
button:hover,.navBtn:hover{transform:translateY(-1px);filter:brightness(.99)}
.s{background:#fff;color:var(--b);border:1px solid #b7ccff}
.d{background:#fff1f2;color:var(--r);border:1px solid #fecdd3}
.w{background:#fff7ed;color:#c2410c;border:1px solid #fdba74}
.p{background:linear-gradient(135deg,#2563eb,#345de8);color:#fff;border:0;box-shadow:0 5px 13px rgba(37,99,235,.18)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.status{padding:12px;border-radius:11px;background:#eff6ff;color:#1d4ed8;white-space:pre-wrap;margin-top:10px}
.err{background:#fef2f2;color:#b91c1c}.hidden{display:none!important}
.listHeader{align-items:center;margin-bottom:4px}.listHeader h2{margin:0;color:#17376b}.listHint{margin:8px 0 4px;padding:10px 12px;border-radius:10px;background:#f8fafc;border:1px solid #e5eaf0}
.modeTabs{display:flex;gap:10px;overflow-x:auto;padding:8px 2px 5px;margin-top:10px;scrollbar-width:thin}.modeTab{flex:1 0 185px;border:2px solid transparent;white-space:nowrap;box-shadow:none}.modeTab.clickTab{background:#fef3c7;color:#92400e;border-color:#fbbf24}.modeTab.hanziTab{background:#fee2e2;color:#991b1b;border-color:#fb7185}.modeTab.teachingTab{background:#dbeafe;color:#1d4ed8;border-color:#93c5fd}.modeTab.evaluationTab{background:#dcfce7;color:#166534;border-color:#86efac}.modeTab.gameTab{background:#ede9fe;color:#6d28d9;border-color:#c4b5fd}.modeTab[aria-selected="true"]{color:#fff;box-shadow:0 6px 15px rgba(15,23,42,.16)}.modeTab.clickTab[aria-selected="true"]{background:#ca8a04;border-color:#ca8a04}.modeTab.hanziTab[aria-selected="true"]{background:#dc2626;border-color:#dc2626}.modeTab.teachingTab[aria-selected="true"]{background:#2563eb;border-color:#2563eb}.modeTab.evaluationTab[aria-selected="true"]{background:#16a34a;border-color:#16a34a}.modeTab.gameTab[aria-selected="true"]{background:#7c3aed;border-color:#7c3aed}
.task{border:1px solid #dbe4ee;border-radius:14px;padding:17px;margin:13px 0;background:rgba(255,255,255,.76);box-shadow:0 5px 14px rgba(15,23,42,.055)}
.modeSection{position:relative;overflow:hidden;padding:18px;border-radius:17px;margin-top:18px}
.modeSection::after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;right:-56px;top:-58px;background:currentColor;opacity:.045;pointer-events:none}
.modeSection.teaching{background:var(--teaching-bg);border:1px solid var(--teaching-border)}
.modeSection.evaluation{background:var(--evaluation-bg);border:1px solid var(--evaluation-border)}
.modeSection.advanced{background:var(--advanced-bg);border:1px solid var(--advanced-border)}
.modeSection.game{background:var(--game-bg);border:1px solid var(--game-border)}
.modeSection.click{background:var(--click-bg);border:1px solid var(--click-border)}
.modeSection.hanzi{background:var(--hanzi-bg);border:1px solid var(--hanzi-border)}
.modeTitle{margin:0 0 12px;padding-bottom:10px;border-bottom:2px solid}
.modeSection.teaching .modeTitle{color:#1d4ed8;border-color:#93c5fd}
.modeSection.evaluation .modeTitle{color:#166534;border-color:#86efac}
.modeSection.advanced .modeTitle{color:#0f766e;border-color:#5eead4}
.modeSection.game .modeTitle{color:#6d28d9;border-color:#c4b5fd}
.modeSection.click .modeTitle{color:#92400e;border-color:#fbbf24}
.modeSection.hanzi .modeTitle{color:#991b1b;border-color:#fb7185}
.task.teachingTask{border-left:5px solid #3b82f6}.task.evaluationTask{border-left:5px solid #22c55e}.task.advancedTask{border-left:5px solid #14b8a6}.task.gameTask{border-left:5px solid #8b5cf6}.task.clickTask{border-left:5px solid #f59e0b}.task.hanziTask{border-left:5px solid #dc2626}
.modeBadge{display:inline-flex;align-items:center;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:900;margin-bottom:7px}.teachingTask .modeBadge{background:#dbeafe;color:#1d4ed8}.evaluationTask .modeBadge{background:#dcfce7;color:#166534}.advancedTask .modeBadge{background:#ccfbf1;color:#0f766e}.gameTask .modeBadge{background:#ede9fe;color:#6d28d9}.clickTask .modeBadge{background:#fef3c7;color:#92400e}.hanziTask .modeBadge{background:#fee2e2;color:#991b1b}
.gameState{display:inline-block;padding:5px 10px;border-radius:999px;background:#ddd6fe;color:#6d28d9;font-size:12px;font-weight:900;margin-top:6px}
.playerRow{display:grid;grid-template-columns:.7fr 1fr 1fr auto;gap:8px;align-items:center;padding:9px;border-bottom:1px solid #ede9fe;font-size:14px}.playerRow:first-child{font-weight:900;background:#faf5ff;border-radius:10px}.playerActions{display:flex;gap:6px}.playerActions button{min-width:auto;padding:7px 10px}.rank1{background:#fef3c7}.rank2{background:#f1f5f9}.rank3{background:#ffedd5}
.task+.task{margin-top:16px}
.top{display:flex;justify-content:space-between;gap:10px;position:relative;z-index:1}
.title{font-size:18px;font-weight:900}
.titleLine{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.restoreTeacherBtn{padding:7px 11px;font-size:13px;min-width:auto}
.meta,.small{font-size:13px;color:var(--m);line-height:1.6}
.badge{padding:4px 8px;border-radius:999px;background:#dbeafe;color:#1d4ed8;font-size:12px;font-weight:800}
.rr{display:grid;grid-template-columns:1.2fr .7fr .7fr 1.2fr;gap:8px;padding:9px;border-bottom:1px solid #e2e8f0;font-size:14px}
.rr.hasAnyError{background:#fff7ed;border-left:4px solid #f97316}.rr.hasFiveWrong{background:#fff1f2;border-left:4px solid #dc2626}.lowErrorMark,.errorCountMark,.fiveWrongMark{display:inline-block;margin-top:5px;padding:4px 7px;border-radius:7px;font-weight:900;line-height:1.5}.lowErrorMark{background:#f3f4f6;color:#111827;border:none}.errorCountMark{background:#ffedd5;color:#c2410c;border:1px solid #fdba74}.fiveWrongMark{background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5}
.clickRecord{margin-top:8px;padding:9px 11px;border-radius:10px;background:#fff;border:1px solid #fde68a;font-size:13px;line-height:1.75}.clickRecord b{color:#92400e}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px;z-index:99}
.box{background:var(--surface);border:1px solid var(--surface-border);padding:22px;border-radius:18px;text-align:center;max-width:390px;width:100%;box-shadow:0 20px 55px rgba(15,23,42,.24)}
.url{word-break:break-all;background:#eef2f7;padding:10px;border-radius:8px;margin:10px 0}
@media(max-width:650px){
  header{padding:11px 12px}.brandMark{width:38px;height:38px}.head{align-items:flex-start}
  main{padding:14px 10px 28px}.card{padding:16px;border-radius:15px}
  .modeSection{padding:13px;margin-top:13px}.rr{grid-template-columns:1fr 1fr}.playerRow{grid-template-columns:.6fr 1fr 1fr}.playerActions{grid-column:1/-1}.playerActions button{flex:1}
  .listHeader{align-items:flex-start}.listHeader h2{font-size:20px}.navBtn,button{padding:10px 12px}
}
</style>
</head>
<body>
<header>
  <div class="head">
    <div class="brand">
      <div class="brandMark">AI</div>
      <div><h1>教師平台</h1><div class="small">教學評量遊戲列表</div></div>
    </div>
    <div id="userArea" class="hidden">
      <button id="logoutBtn" class="s">關閉</button>
    </div>
  </div>
</header>
<main>
  <section id="authCard" class="card">
    <h2>教師登入</h2>
    <div class="row">
      <input id="email" type="email" placeholder="教師 Email" style="padding:12px;border:1px solid #cbd5e1;border-radius:10px">
      <input id="password" type="password" placeholder="密碼" style="padding:12px;border:1px solid #cbd5e1;border-radius:10px">
    </div>
    <button id="loginBtn" class="p" style="margin-top:10px">登入</button>
    <div id="authStatus" class="status">請先登入。</div>
  </section>

  <section id="taskCard" class="card hidden">
    <div class="top listHeader">
      <div><h2>教學與評量列表</h2></div>
      <button id="refreshBtn" class="s">重新整理</button>
    </div>
    <div class="modeTabs" role="tablist" aria-label="選擇任務模式">
      <button class="modeTab clickTab" type="button" data-mode="click" role="tab" aria-selected="true">簡易點選練習模式</button>
      <button class="modeTab hanziTab" type="button" data-mode="hanzi" role="tab" aria-selected="false">國字練習模式</button>
      <button class="modeTab teachingTab" type="button" data-mode="teaching" role="tab" aria-selected="false">物品(文字)辨識教學模式</button>
      <button class="modeTab evaluationTab" type="button" data-mode="evaluation" role="tab" aria-selected="false">評量模式</button>
      <button class="modeTab gameTab" type="button" data-mode="game" role="tab" aria-selected="false">多人遊戲模式</button>
    </div>
    <div class="small listHint">點選上方模式按鈕可查看相關資訊列表。可先匯出學生結果，再只清除辨識照片；「完整刪除」會一併清除學生紀錄、照片與遊戲資料。</div>
    <div id="taskList"></div>
  </section>
</main>

<div id="qrModal" class="modal hidden">
  <div class="box">
    <h3 id="qrTitle">任務 QR Code</h3>
    <div id="qrCode"></div>
    <div id="qrURL" class="url"></div>
    <div class="row">
      <button id="copyBtn" class="p">複製網址</button>
      <button id="closeBtn" class="s">關閉</button>
    </div>
  </div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyBbpIezLbQd2-e-3Z4pSdBLIFc_UlTPUy8",authDomain:"project-6540500202923576846.firebaseapp.com",projectId:"project-6540500202923576846",storageBucket:"project-6540500202923576846.firebasestorage.app",messagingSenderId:"516602165604",appId:"1:516602165604:web:b60f69ee56a4d49c416271"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
let user=null,unsub=null,playerUnsubs=[],activeMode="click",renderGeneration=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function getItemErrorGroups(data,fieldName,legacyItems=[],includeSkipped=false){
  const source=data&&data[fieldName];
  const counts=source&&typeof source==="object"&&!Array.isArray(source)
    ? source
    : {};
  const entries=Object.entries(counts)
    .map(([name,count])=>[String(name).trim(),Math.max(0,Number(count)||0)])
    .filter(([name])=>name);
  const twoOnly=entries.filter(([,count])=>count===2).map(([name])=>name);
  const threeToFour=entries.filter(([,count])=>count>=3&&count<=4).map(([name])=>name);
  const fiveOrMore=entries.filter(([,count])=>count>=5).map(([name])=>name);
  if(includeSkipped){
    const skipped=Array.isArray(data&&data.skippedClasses)?data.skippedClasses.filter(Boolean):[];
    skipped.forEach(name=>fiveOrMore.push(String(name)));
  }
  if(!entries.length&&fieldName==="itemErrorCounts"){
    const distinctLegacy=[...new Set(legacyItems.filter(Boolean).map(String))];
    const total=Math.max(0,Number(data&&data.errorCount)||0);
    if(distinctLegacy.length===1&&total===2)twoOnly.push(distinctLegacy[0]);
    if(distinctLegacy.length===1&&total>=3&&total<=4)threeToFour.push(distinctLegacy[0]);
  }
  const fiveSet=new Set(fiveOrMore);
  return {
    twoOnly:[...new Set(twoOnly)].filter(name=>!fiveSet.has(name)),
    threeToFour:[...new Set(threeToFour)].filter(name=>!fiveSet.has(name)),
    fiveOrMore:[...fiveSet]
  };
}
function status(id,msg,type=""){const e=$(id);e.textContent=msg;e.className="status "+type}
function recognitionEngineName(engine){
  if(engine==="ocr")return "OCR 文字辨識";
  if(engine==="coco-ssd")return "COCO-SSD 開放辨識";
  return "Teachable Machine 自訂辨識";
}

auth.onAuthStateChanged(u=>{
  user=u;
  if(u){
    $("authCard").classList.add("hidden");
    $("taskCard").classList.remove("hidden");
    $("userArea").classList.remove("hidden");
    listen();
  }else{
    renderGeneration++;
    $("authCard").classList.remove("hidden");
    $("taskCard").classList.add("hidden");
    $("userArea").classList.add("hidden");
    if(unsub)unsub();
    playerUnsubs.forEach(fn=>fn());playerUnsubs=[];
  }
});

$("loginBtn").onclick=async()=>{
  try{await auth.signInWithEmailAndPassword($("email").value.trim(),$("password").value)}
  catch(e){status("authStatus","登入失敗：\n"+e.message,"err")}
};
$("logoutBtn").onclick=()=>window.close();

function studentURL(id){
  const u=new URL("student.html",location.href);
  u.searchParams.set("task",id);
  u.searchParams.set("v","2.6-optimized");
  return u.toString();
}
function showQR(id,title){
  const url=studentURL(id);
  $("qrTitle").textContent=title+"－QR Code";
  $("qrURL").textContent=url;
  $("qrCode").innerHTML="";
  new QRCode($("qrCode"),{text:url,width:260,height:260,correctLevel:QRCode.CorrectLevel.M});
  $("qrModal").classList.remove("hidden");
}
window.showQR=showQR;
function restoreTeacherPlatform(id){
  const u=new URL("teacher.html",location.href);
  u.searchParams.set("restoreTask",id);
  location.href=u.toString();
}
window.restoreTeacherPlatform=restoreTeacherPlatform;
$("closeBtn").onclick=()=>$("qrModal").classList.add("hidden");
$("copyBtn").onclick=()=>navigator.clipboard.writeText($("qrURL").textContent);

function listen(){
  if(unsub)unsub();
  $("taskList").innerHTML='<div class="status">正在載入任務列表…</div>';
  unsub=db.collection("tasks").where("teacherId","==",user.uid).onSnapshot(
    async s=>{try{await render(s.docs)}catch(e){$("taskList").innerHTML='<div class="status err">'+esc(e.message||e)+'</div>'}},
    e=>$("taskList").innerHTML='<div class="status err">'+esc(e.message||e)+'</div>'
  );
}

async function refreshTasks(){
  const btn=$("refreshBtn");
  btn.disabled=true;btn.textContent="整理中…";
  try{
    const snap=await db.collection("tasks").where("teacherId","==",user.uid).get();
    await render(snap.docs);
  }catch(e){$("taskList").innerHTML='<div class="status err">'+esc(e.message||e)+'</div>'}
  finally{btn.disabled=false;btn.textContent="重新整理"}
}
$("refreshBtn").onclick=refreshTasks;

const modeTabs=[...document.querySelectorAll(".modeTab")];
function applyModeFilter(){
  modeTabs.forEach(btn=>btn.setAttribute("aria-selected",String(btn.dataset.mode===activeMode)));
  const sections=[...document.querySelectorAll("#taskList .modeSection")];
  sections.forEach(section=>section.classList.toggle("hidden",section.dataset.mode!==activeMode));
  const oldEmpty=$("modeEmpty");if(oldEmpty)oldEmpty.remove();
  if(!sections.some(section=>section.dataset.mode===activeMode)){
    const names={click:"簡易點選練習模式",teaching:"物品(文字)辨識教學模式",hanzi:"國字練習模式",evaluation:"評量模式",game:"多人遊戲模式"};
    const empty=document.createElement("div");empty.id="modeEmpty";empty.className="status";empty.textContent="目前沒有「"+names[activeMode]+"」資料。";
    $("taskList").appendChild(empty);
  }
}
modeTabs.forEach(btn=>btn.addEventListener("click",()=>{activeMode=btn.dataset.mode;applyModeFilter()}));

async function render(docs){
  const generation=++renderGeneration;
  const getTime=doc=>{
    const value=doc.data().createdAt;
    if(value&&typeof value.toMillis==="function")return value.toMillis();
    if(value&&typeof value.seconds==="number")return value.seconds*1000;
    return 0;
  };

  const newestFirst=[...docs].sort((a,b)=>getTime(b)-getTime(a));
  const teachingDocs=newestFirst.filter(doc=>doc.data().taskMode==="teaching");
  const gameDocs=newestFirst.filter(doc=>doc.data().taskMode==="game");
  const advancedDocs=newestFirst.filter(doc=>doc.data().taskMode==="advanced");
  const clickDocs=newestFirst.filter(doc=>doc.data().taskMode==="click");
  const hanziDocs=newestFirst.filter(doc=>doc.data().taskMode==="hanzi");
  const evaluationDocs=newestFirst.filter(doc=>!["teaching","advanced","game","click","hanzi"].includes(doc.data().taskMode));

  const renderTeachingTask=doc=>{
    const t=doc.data();
    const recognitionInfo=`<div class="meta">辨識方式：${recognitionEngineName(t.recognitionEngine)}</div>`;
    const descriptions=t.classDescriptions&&typeof t.classDescriptions==="object"
      ? t.classDescriptions
      : {};

    const itemInfo=(t.targetClasses||[]).map(name=>{
      const description=String(descriptions[name]||"").trim();
      return description
        ? `${esc(name)}：${esc(description)}`
        : esc(name);
    }).join("<br>");

    return `<div class="task teachingTask">
      <div class="top">
        <div>
          <span class="modeBadge">物品(文字)辨識教學模式</span>
          <div class="titleLine">
            <div class="title">${esc(t.title||"未命名物品(文字)辨識教學模式")}</div>
            <button class="s restoreTeacherBtn" type="button" onclick="restoreTeacherPlatform('${doc.id}')">回復教師平台</button>
          </div>
          ${recognitionInfo}
          <div class="meta">物品與說明：<br>${itemInfo||"尚無物品資料"}</div>
        </div>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="s" onclick="showQR('${doc.id}','${esc(t.title||"物品(文字)辨識教學模式")}')">重新產生 QR</button>
        <button class="d" onclick="delTask('${doc.id}')">完整刪除</button>
      </div>
    </div>`;
  };

  const renderGameTask=doc=>{
    const t=doc.data();
    const recognitionInfo=`<div class="meta">辨識方式：${recognitionEngineName(t.recognitionEngine)}</div>`;
    const stateText={lobby:"等待學生加入",active:"遊戲進行中",finished:"遊戲已結束"}[t.gameStatus]||"等待學生加入";
    const audioItems=Array.isArray(t.audioRequiredClasses)
      ? t.audioRequiredClasses.filter(name=>(t.targetClasses||[]).includes(name))
      : [];
    const audioInfo=audioItems.length
      ? `<div class="meta">瀏覽器語音辨識（zh-TW）：${audioItems.map(esc).join("、")}</div>`
      : "";
    const promptInfo=t.promptMode==="description"
      ? '<div class="meta">出題方式：說明文字出題</div>'
      : "";
    return `<div class="task gameTask">
      <div class="top">
        <div>
          <span class="modeBadge">多人遊戲模式</span>
          <div class="titleLine">
            <div class="title">${esc(t.title||"未命名遊戲")}</div>
            <button class="s restoreTeacherBtn" type="button" onclick="restoreTeacherPlatform('${doc.id}')">回復教師平台</button>
          </div>
          ${recognitionInfo}
          ${promptInfo}
          <div class="meta">尋找順序：${(t.targetClasses||[]).map(esc).join(" → ")}</div>
          ${audioInfo}
          <span class="gameState" id="gameState_${doc.id}">${stateText}</span>
        </div>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="s" onclick="showQR('${doc.id}','${esc(t.title||"遊戲")}')">顯示遊戲 QR</button>
        <button class="s" onclick="exportTaskCSV('${doc.id}')">匯出結果 CSV</button>
        <button class="w" onclick="clearTaskPhotos('${doc.id}')">只清除照片</button>
        <button class="p" onclick="startGame('${doc.id}')">全員開始</button>
        <button class="s" onclick="finishGame('${doc.id}')">結束遊戲</button>

function gameStatusText(status){
  return {pending:"等待同意",approved:"已同意",playing:"尋找中",completed:"已完成",rejected:"未通過"}[status]||status||"等待";
}

function listenGamePlayers(taskId){
  const unsubPlayers=db.collection("tasks").doc(taskId).collection("gamePlayers").onSnapshot(snap=>{
    const box=$("gamePlayers_"+taskId);if(!box)return;
    const players=snap.docs.map(doc=>({id:doc.id,...doc.data()}));
    players.sort((a,b)=>{
      if(a.rank&&b.rank)return a.rank-b.rank;
      if(a.rank)return -1;if(b.rank)return 1;
      return Number(a.studentNumber||a.id)-Number(b.studentNumber||b.id);
    });
    if(!players.length){box.innerHTML='<div class="status">尚無學生加入。</div>';return}
    box.innerHTML=`<div class="playerRow"><span>號碼</span><span>狀態</span><span>名次</span><span>教師操作</span></div>`+players.map(p=>{
      const rank=p.rank?`第 ${p.rank} 名`:"—";
      const actions=p.status==="pending"
        ? `<div class="playerActions"><button class="p" onclick="approvePlayer('${taskId}','${p.id}')">同意</button><button class="d" onclick="rejectPlayer('${taskId}','${p.id}')">不同意</button></div>`
        : '<span class="small">—</span>';
      return `<div class="playerRow ${p.rank&&p.rank<=3?'rank'+p.rank:''}"><b>${esc(p.studentNumber||p.id)}</b><span>${gameStatusText(p.status)}</span><span>${rank}</span>${actions}</div>`;
    }).join("");
  },e=>{const box=$("gamePlayers_"+taskId);if(box)box.innerHTML='<div class="status err">'+esc(e.message||e)+'</div>'});
  playerUnsubs.push(unsubPlayers);
}

window.approvePlayer=async(taskId,playerId)=>{
  const taskRef=db.collection("tasks").doc(taskId);
  const playerRef=taskRef.collection("gamePlayers").doc(playerId);
  try{
    await db.runTransaction(async tx=>{
      const taskSnap=await tx.get(taskRef);
      if(!taskSnap.exists||taskSnap.data().gameStatus!=="lobby")throw new Error("遊戲已開始，不能再同意新學生");
      tx.update(playerRef,{status:"approved",approvedAt:firebase.firestore.FieldValue.serverTimestamp()});
    });
  }catch(e){alert(e.message||e)}
};

window.rejectPlayer=async(taskId,playerId)=>{
  await db.collection("tasks").doc(taskId).collection("gamePlayers").doc(playerId).update({
    status:"rejected",rejectedAt:firebase.firestore.FieldValue.serverTimestamp()
  });
};

window.startGame=async taskId=>{
  const taskRef=db.collection("tasks").doc(taskId);
  const approved=await taskRef.collection("gamePlayers").where("status","==","approved").get();
  if(approved.empty){alert("請先同意至少一位學生加入遊戲。");return}
  if(!confirm(`確定讓 ${approved.size} 位學生同時開始尋找物品？`))return;
  await taskRef.collection("gameControl").doc("ranking").set({count:0});
  await taskRef.update({
    gameStatus:"active",
    gameFinishCount:0,
    gameStartedAt:firebase.firestore.FieldValue.serverTimestamp()
  });
};

window.finishGame=async taskId=>{
  if(!confirm("確定結束這場遊戲？"))return;
  await db.collection("tasks").doc(taskId).update({
    gameStatus:"finished",
    gameEndedAt:firebase.firestore.FieldValue.serverTimestamp()
  });
};

async function clearGamePlayers(taskId){
  const collection=db.collection("tasks").doc(taskId).collection("gamePlayers");
  while(true){
    const snap=await collection.limit(400).get();
    if(snap.empty)break;
    const batch=db.batch();snap.docs.forEach(doc=>batch.delete(doc.ref));await batch.commit();
    if(snap.size<400)break;
  }
  await db.collection("tasks").doc(taskId).collection("gameControl").doc("ranking").delete().catch(()=>{});
}

window.resetGame=async taskId=>{
  if(!confirm("重新開放會清除這場遊戲的等待名單與排名，確定繼續？"))return;
  await clearGamePlayers(taskId);
  await db.collection("tasks").doc(taskId).collection("gameControl").doc("ranking").set({count:0});
  await db.collection("tasks").doc(taskId).update({
    gameStatus:"lobby",gameFinishCount:0,
    gameStartedAt:firebase.firestore.FieldValue.delete(),
    gameEndedAt:firebase.firestore.FieldValue.delete()
  });
};

async function getTaskResultDocs(taskId){
  const snap=await db.collection("taskResults")
    .where("teacherId","==",user.uid)
    .where("taskId","==",taskId)
    .get();
  return snap.docs;
}

async function deleteDocsInBatches(docs,size=400){
  for(let start=0;start<docs.length;start+=size){
    const batch=db.batch();
    docs.slice(start,start+size).forEach(doc=>batch.delete(doc.ref));
    await batch.commit();
  }
}

async function deleteEvidenceForResult(resultDoc){
  let deleted=0;
  while(true){
    const snap=await resultDoc.ref.collection("evidence").limit(400).get();
    if(snap.empty)break;
    await deleteDocsInBatches(snap.docs);
    deleted+=snap.size;
    if(snap.size<400)break;
  }
  return deleted;
}

async function clearEvidenceForTask(taskId){
  const resultDocs=await getTaskResultDocs(taskId);
  let photoCount=0;
  for(const resultDoc of resultDocs){
    photoCount+=await deleteEvidenceForResult(resultDoc);
  }
  return {resultDocs,photoCount};
}

function csvValue(value){

function timestampText(value){

  try{
    const date=typeof value.toDate==="function"?value.toDate():new Date(value);
    return date.toLocaleString("zh-TW",{hour12:false});
  }catch(e){return ""}

function csvErrorRange(data,min,max){
  const inRange=count=>count>=min&&(max===Infinity||count<=max);
  const formatEntries=(field,label)=>{
    const source=data&&data[field];
    if(!source||typeof source!=="object"||Array.isArray(source))return {text:"",names:[]};
    const entries=Object.entries(source)
      .map(([name,count])=>[String(name).trim(),Math.max(0,Number(count)||0)])
      .filter(([name,count])=>name&&inRange(count));
    return {
      text:entries.length?`${label}${entries.map(([name,count])=>`${name}（${count} 次）`).join("、")}`:"",
      names:entries.map(([name])=>name)
    };
  };
  const hasTypedCounts=data&&(
    data.imageItemErrorCounts&&typeof data.imageItemErrorCounts==="object"||
    data.audioItemErrorCounts&&typeof data.audioItemErrorCounts==="object"
  );
  const parts=[];
  const listed=new Set();
  if(hasTypedCounts){
    const image=formatEntries("imageItemErrorCounts","拍照辨識：");
    const audio=formatEntries("audioItemErrorCounts","語音辨識：");
    if(image.text)parts.push(image.text);
    if(audio.text)parts.push(audio.text);
    [...image.names,...audio.names].forEach(name=>listed.add(name));
  }else{
    const all=formatEntries("itemErrorCounts","");
    if(all.text)parts.push(all.text);
    all.names.forEach(name=>listed.add(name));
    if(!all.text){
      const legacyItems=[...new Set([...(data.incorrectClasses||[]),...(data.incorrectAudioClasses||[])].filter(Boolean).map(String))];
      const total=Math.max(0,Number(data.errorCount)||0);
      if(legacyItems.length===1&&inRange(total)){
        parts.push(`${legacyItems[0]}（${total} 次）`);
        listed.add(legacyItems[0]);
      }
    }
  }
  if(min>=5&&Array.isArray(data&&data.skippedClasses)){
    const skipped=[...new Set(data.skippedClasses.filter(Boolean).map(String))].filter(name=>!listed.has(name));
    if(skipped.length)parts.push(`其他：${skipped.map(name=>`${name}（5 次以上）`).join("、")}`);
  }
  return parts.join("；");
}

window.exportTaskCSV=async taskId=>{
  try{
    const [taskSnap,resultDocs]=await Promise.all([
      db.collection("tasks").doc(taskId).get(),
      getTaskResultDocs(taskId)
    ]);
    if(!resultDocs.length){alert("此任務目前沒有學生結果可以匯出。");return}
    const title=taskSnap.exists?(taskSnap.data().title||"任務結果"):"任務結果";
    const sorted=[...resultDocs].sort((a,b)=>Number(a.data().studentCode||999)-Number(b.data().studentCode||999));
    const header=["任務名稱","學生編號","學生名稱","完成進度","狀態","錯誤次數","錯誤 1～2 次","錯誤 3～4 次","錯誤 5 次以上","辨識錯誤項目","遊戲名次","點選答對次數","點選逾時次數","平均點選時間(秒)","開始時間","完成時間"];
    const rows=sorted.map(doc=>{
      const data=doc.data();
      const incorrect=Array.isArray(data.incorrectClasses)?[...new Set(data.incorrectClasses.filter(Boolean))].join("、"):"";
      return [
        title,data.studentCode||"",data.studentName||"",`${Number(data.progress||0)}%`,
        data.status==="completed"?"完成":"進行中",Number(data.attempts||0),
        csvErrorRange(data,1,2),csvErrorRange(data,3,4),csvErrorRange(data,5,Infinity),incorrect,
        data.gameRank?`第 ${data.gameRank} 名`:"",Number(data.clickCorrectCount||0),Number(data.clickMissCount||0),
        Number(data.clickAverageReactionMs||0)?(Number(data.clickAverageReactionMs)/1000).toFixed(2):"",timestampText(data.startedAt),timestampText(data.completedAt)
      ].map(csvValue).join(",");
    });
    const csv="\uFEFF"+[header.map(csvValue).join(","),...rows].join("\r\n");
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const link=document.createElement("a");
    link.href=url;
    link.download=(title.replace(/[\\/:*?"<>|]/g,"_")||"任務結果")+".csv";
    document.body.appendChild(link);link.click();link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(e){
    alert("匯出結果失敗：\n"+(e.message||e));
  }
};

window.delTask=async id=>{
  if(!confirm("確定完整刪除此任務？\n\n將一併刪除：\n・學生作答紀錄\n・所有辨識照片\n・遊戲學生名單與排名\n・任務本身\n\n刪除後無法復原，建議先匯出 CSV。"))return;
  try{
    const {resultDocs,photoCount}=await clearEvidenceForTask(id);
    await deleteDocsInBatches(resultDocs);
    await clearGamePlayers(id);
    await db.collection("tasks").doc(id).delete();
    alert(`完整刪除成功。\n已刪除 ${resultDocs.length} 筆學生紀錄與 ${photoCount} 張辨識照片。`);
  }catch(e){
    alert("完整刪除失敗：\n"+(e.message||e)+"\n\n請重新整理後再試一次。");
  }
};
</script>
