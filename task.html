function getItemErrorGroups(data,fieldName,legacyItems=[],includeSkipped=false){
  const source=data&&data[fieldName];
  const counts=source&&typeof source==="object"&&!Array.isArray(source)
    ? source
    : {};
  const entries=Object.entries(counts)
    .map(([name,count])=>[String(name).trim(),Math.max(0,Number(count)||0)])
    .filter(([name])=>name);
  const twoOnly=entries.filter(([,count])=>count>=1&&count<=2).map(([name])=>name);
  const threeToFour=entries.filter(([,count])=>count>=3&&count<=4).map(([name])=>name);
  const fiveOrMore=entries.filter(([,count])=>count>=5).map(([name])=>name);
  if(includeSkipped){
    const skipped=Array.isArray(data&&data.skippedClasses)?data.skippedClasses.filter(Boolean):[];
    skipped.forEach(name=>fiveOrMore.push(String(name)));
  }
  if(!entries.length&&fieldName==="itemErrorCounts"){
    const distinctLegacy=[...new Set(legacyItems.filter(Boolean).map(String))];
    const total=Math.max(0,Number(data&&data.errorCount)||0);
    if(distinctLegacy.length===1&&total>=1&&total<=2)twoOnly.push(distinctLegacy[0]);
    if(distinctLegacy.length===1&&total>=3&&total<=4)threeToFour.push(distinctLegacy[0]);
  }
  const fiveSet=new Set(fiveOrMore);
  return {
    twoOnly:[...new Set(twoOnly)].filter(name=>!fiveSet.has(name)),
    threeToFour:[...new Set(threeToFour)].filter(name=>!fiveSet.has(name)),
    fiveOrMore:[...fiveSet]
  };
}

function speechRecognitionStandardInfo(task){
  const targets=Array.isArray(task&&task.targetClasses)?task.targetClasses:[];
  const englishTask=targets.length>0&&targets.every(target=>/[A-Za-z]/.test(String(target||""))&&!/\p{Script=Han}/u.test(String(target||"")));

  return `<div class="meta">語音辨識標準：${standard}</div><div class="meta">語音模糊辨識：${fuzzy}</div>`;
}

  "ㄌ／ㄋ":{practice:["拉—拿","來—奶","老—腦","藍—南","亮—尿"],tip:"發ㄌ時舌尖輕碰上齒齦，氣流從舌頭兩側通過；發ㄋ時氣流由鼻腔通過。可先分開練，再練最小對立詞。"},
  "ㄓ／ㄗ":{practice:["知—資","張—髒","主—組"],tip:"ㄓ需要舌尖微微捲起；ㄗ的舌尖靠近下齒背。先用鏡子觀察舌位，再由單音進入詞語。"},
  "ㄔ／ㄘ":{practice:["吃—雌","長—藏","初—粗"],tip:"ㄔ需要舌尖微捲並送氣；ㄘ舌尖靠近下齒背並送氣。可用薄紙比較兩者氣流與舌位。"},
  "ㄕ／ㄙ":{practice:["詩—司","山—三","是—四"],tip:"ㄕ需要舌尖微捲；ㄙ的舌尖靠近下齒背。先慢速拉長摩擦音，再接上韻母。"},
  "ㄐ／ㄑ／ㄒ":{practice:["雞—七—西","家—掐—蝦","精—青—星"],tip:"三個音都在舌面前部形成；可先區分是否送氣，再利用鏡子與慢速示範練習。"},
  "ㄣ／ㄥ":{practice:["真—爭","盆—棚","身—生"],tip:"ㄣ收音位置較前；ㄥ的舌根較後並帶鼻音。可先延長韻尾，再比較口腔共鳴位置。"},
  "ㄢ／ㄤ":{practice:["班—幫","看—抗","南—囊"],tip:"ㄢ收音位置較前；ㄤ的舌根較後。可用誇張慢速示範，先練韻母再放回詞語。"},
  "ㄧㄣ／ㄧㄥ":{practice:["音—英","近—靜","心—星"],tip:"ㄧㄣ收音較前；ㄧㄥ的舌根較後。可先分辨尾音，再加入前面的聲母。"},
  "ㄧㄤ／ㄧㄠ":{practice:["亮—料","香—消","將—交"],tip:"ㄧㄤ最後要保留後鼻音；ㄧㄠ最後滑向ㄨ音。可先分段慢念，再逐漸加快。"},
  "介符":{practice:["ㄧ—ㄨ—ㄩ","家—瓜","街—追","學—說"],tip:"先單獨分辨ㄧ、ㄨ、ㄩ，再接上相同韻符進行比較。"},
  "多音節語句":{practice:["先分成2至4字短語","逐段仿說","最後串成完整句子"],tip:"先用節奏、拍手或圖卡標示每個音節，再由短語逐步延長，避免一次要求完整長句。"}
};

function pronunciationHanText(value){
  return (String(value||"").match(/\p{Script=Han}+/gu)||[]).join("");
}

function isExcludedPronunciationInput(value){
  const text=String(value||"").normalize("NFKC").trim();
  if(!text||/\d/.test(text))return true;
  return /(?:siri|hey\s*siri|嘿\s*siri|小愛同學|google\s*(?:助理|assistant)|語音助理)/i.test(text);
}

function pronunciationInitial(token){
  const value=String(token||"").toLowerCase().replace(/[^a-züv]/g,"");
  const match=value.match(/^(zh|ch|sh|[bpmfdtnlgkhjqxrzcs])/);
  return match?match[1]:"∅";
}

function pronunciationFinal(token){
  const value=String(token||"").toLowerCase().replace(/[^a-züv]/g,"").replace(/ü/g,"v");
  const initial=value.match(/^(zh|ch|sh|[bpmfdtnlgkhjqxrzcs])/);
  const initialText=initial?initial[1]:"";
  let finalPart="";
  if(initialText){
    finalPart=value.slice(initialText.length);
    if(/^[jqx]$/.test(initialText)&&finalPart.startsWith("u"))finalPart="v"+finalPart.slice(1);
  }else if(value.startsWith("y")){
    const yMap={yi:"i",ya:"ia",yo:"io",ye:"ie",yao:"iao",you:"iou",yan:"ian",yin:"in",yang:"iang",ying:"ing",yong:"iong",yu:"v",yue:"ve",yuan:"van",yun:"vn"};
    finalPart=yMap[value]||("i"+value.slice(1));
  }else if(value.startsWith("w")){
    const wMap={wu:"u",wa:"ua",wo:"uo",wai:"uai",wei:"uei",wan:"uan",wen:"uen",wang:"uang",weng:"ueng"};
    finalPart=wMap[value]||("u"+value.slice(1));
  }else finalPart=value;
  if(finalPart==="iu")finalPart="iou";
  else if(finalPart==="ui")finalPart="uei";
  else if(finalPart==="un")finalPart="uen";
  return finalPart||"NONE";
}

function pronunciationFinalComponents(finalPart){
  const exact={
    i:["i","NONE"],u:["u","NONE"],v:["v","NONE"],
    ia:["i","a"],io:["i","o"],ie:["i","eh"],iao:["i","ao"],iou:["i","ou"],ian:["i","an"],in:["i","en"],iang:["i","ang"],ing:["i","eng"],iong:["v","eng"],
    ua:["u","a"],uo:["u","o"],uai:["u","ai"],uei:["u","ei"],uan:["u","an"],uen:["u","en"],uang:["u","ang"],ueng:["u","eng"],ong:["u","eng"],
    ve:["v","eh"],van:["v","an"],vn:["v","en"]
  };
  if(exact[finalPart])return {medial:exact[finalPart][0],rhyme:exact[finalPart][1]};
  return {medial:"NONE",rhyme:finalPart||"NONE"};
}

function pronunciationSyllables(text){
  const source=pronunciationHanText(text);
  if(!source||!window.pinyinPro||typeof window.pinyinPro.pinyin!=="function")return [];
  try{
    return window.pinyinPro.pinyin(source,{toneType:"num",type:"array"}).map(raw=>{
      const normalized=String(raw||"").toLowerCase().replace(/ü/g,"v");
      const toneMatch=normalized.match(/([0-5])$/);
      const tone=toneMatch?toneMatch[1]:"";
      const plain=normalized.replace(/[0-5]$/g,"");
      const final=pronunciationFinal(plain);
      const components=pronunciationFinalComponents(final);
      return {raw:normalized,plain,tone,initial:pronunciationInitial(plain),final,medial:components.medial,rhyme:components.rhyme};
    }).filter(item=>item.plain&&/[a-zv]/.test(item.plain));
  }catch(error){
    console.warn("發音分析拼音轉換失敗",error);
    return [];
  }
}

function pronunciationRelatedPart(left,right,part){
  if(!left||!right||left===right)return false;
  return PRONUNCIATION_CONFUSION_RULES.some(rule=>rule.part===part&&rule.members.has(left)&&rule.members.has(right));
}

function pronunciationSubstitutionCost(left,right){
  if(left.plain===right.plain)return left.tone===right.tone?0:.1;
  if(left.initial===right.initial&&left.final===right.final)return .15;
  if(pronunciationRelatedPart(left.initial,right.initial,"initial")&&left.final===right.final)return .35;
  if(left.initial===right.initial&&pronunciationRelatedPart(left.final,right.final,"final"))return .35;
  if(pronunciationRelatedPart(left.initial,right.initial,"initial")||pronunciationRelatedPart(left.final,right.final,"final"))return .65;
  return 1;
}

function alignPronunciationSyllables(target,spoken){
  const rows=target.length+1,cols=spoken.length+1;
  const cost=Array.from({length:rows},()=>Array(cols).fill(0));
  const step=Array.from({length:rows},()=>Array(cols).fill(""));
  for(let i=1;i<rows;i++){cost[i][0]=i;step[i][0]="delete"}
  for(let j=1;j<cols;j++){cost[0][j]=j;step[0][j]="insert"}
  for(let i=1;i<rows;i++)for(let j=1;j<cols;j++){
    const choices=[
      {cost:cost[i-1][j-1]+pronunciationSubstitutionCost(target[i-1],spoken[j-1]),step:"pair"},
      {cost:cost[i-1][j]+1,step:"delete"},
      {cost:cost[i][j-1]+1,step:"insert"}
    ].sort((a,b)=>a.cost-b.cost||({pair:0,delete:1,insert:2}[a.step]-{pair:0,delete:1,insert:2}[b.step]));
    cost[i][j]=choices[0].cost;step[i][j]=choices[0].step;
  }
  const aligned=[];let i=target.length,j=spoken.length;
  while(i>0||j>0){
    const action=step[i][j]||(i>0?"delete":"insert");
    if(action==="pair"){aligned.push({target:target[i-1],spoken:spoken[j-1],type:"pair"});i--;j--}
    else if(action==="delete"){aligned.push({target:target[i-1],spoken:null,type:"delete"});i--}
    else{aligned.push({target:null,spoken:spoken[j-1],type:"insert"});j--}
  }
  return aligned.reverse();
}

function pronunciationErrorCountMap(data){
  const preferred=data&&data.audioItemErrorCounts;
  if(preferred&&typeof preferred==="object"&&!Array.isArray(preferred))return preferred;
  const legacy=data&&data.itemErrorCounts;
  return legacy&&typeof legacy==="object"&&!Array.isArray(legacy)?legacy:{};
}

function weightedPronunciationRecords(data){
  return (Array.isArray(data&&data.speechInputRecords)?data.speechInputRecords:[]).map(record=>{
    const item=record&&typeof record==="object"?record:{};
    return {target:String(item.target||"").trim(),input:String(item.input||"").trim(),correct:item.correct===true};
  }).filter(item=>!item.correct&&pronunciationHanText(item.target)&&pronunciationHanText(item.input)&&!isExcludedPronunciationInput(item.input))
    .map(record=>({...record,weight:1}));
}

function pronunciationFinalsClose(left,right){
  return left===right||pronunciationRelatedPart(left,right,"final");
}

function pronunciationExampleText(record){
  return `${record.target} → ${record.input}`;
}

function pronunciationSymbol(part,value){
  return (PRONUNCIATION_SYMBOLS[part]&&PRONUNCIATION_SYMBOLS[part][value])||String(value||"");
}

function pronunciationDirectionLabel(part,from,to){
  const category={sound:"聲符",medial:"介符",rhyme:"韻符"}[part]||"發音";
  return `${category}：${pronunciationSymbol(part,from)}→${pronunciationSymbol(part,to)}`;
}

function pronunciationFrequentSummary(examples){
  const groups=new Map();
  (examples||[]).forEach(record=>{
    if(!groups.has(record.target))groups.set(record.target,[]);
    const inputs=groups.get(record.target);
    if(!inputs.includes(record.input))inputs.push(record.input);
  });
  const best=[...groups.entries()].sort((a,b)=>b[1].length-a[1].length||a[0].localeCompare(b[0],"zh-Hant"))[0];
  if(!best)return "";
  return `「${best[0]}」常出現「${best[1].slice(0,5).join("、")}」等辨識結果。`;
}

function pronunciationTeachingContent(item){
  const familyLabels=[...new Set((item.directions||[]).flatMap(direction=>direction.familyLabels?[...direction.familyLabels]:[direction.familyLabel]).filter(Boolean))];
  if(item.label==="多音節語句")familyLabels.push("多音節語句");
  const rules=familyLabels.map(label=>PRONUNCIATION_TEACHING_RULES[label]).filter(Boolean);
  return {
    practice:[...new Set(rules.flatMap(rule=>rule.practice||[]))].slice(0,8),
    tips:[...new Set(rules.map(rule=>rule.tip).filter(Boolean))]
  };
}

function mergeRelatedPronunciationStats(directionStats){
  const pairCandidates=[];
  for(let i=0;i<directionStats.length;i++)for(let j=i+1;j<directionStats.length;j++){
    const left=directionStats[i],right=directionStats[j];
    if(left.part===right.part)continue;
    const overlap=[...left.recordIds].filter(id=>right.recordIds.has(id)).length;
    const ratio=overlap/Math.max(1,Math.min(left.recordIds.size,right.recordIds.size));
    if(overlap>=3&&ratio>=.6)pairCandidates.push({left,right,overlap,ratio});
  }
  pairCandidates.sort((a,b)=>b.overlap-a.overlap||b.ratio-a.ratio);
  const used=new Set(),merged=[];
  pairCandidates.forEach(candidate=>{
    if(used.has(candidate.left.key)||used.has(candidate.right.key))return;
    used.add(candidate.left.key);used.add(candidate.right.key);
    const partOrder={sound:0,medial:1,rhyme:2};
    const directions=[candidate.left,candidate.right].sort((a,b)=>(partOrder[a.part]??9)-(partOrder[b.part]??9));
    merged.push({
      key:directions.map(item=>item.key).join("+"),
      label:directions.map(item=>item.label).join("及"),
      count:Math.max(...directions.map(item=>item.count)),
      countText:directions.map(item=>`${item.label} ${item.count}次`).join("；"),
      examples:[...new Map(directions.flatMap(item=>item.examples).map(record=>[`${record.target}\u0000${record.input}`,record])).values()].slice(0,8),
      directions
    });
  });
  directionStats.filter(item=>!used.has(item.key)).forEach(item=>merged.push({...item,directions:[item]}));
  return merged;
}

function renderPronunciationAnalysis(data){
  const records=weightedPronunciationRecords(data);
  const prepared=records.map(record=>({
    ...record,
    targetSyllables:pronunciationSyllables(record.target),
    spokenSyllables:pronunciationSyllables(record.input)
  })).filter(record=>record.targetSyllables.length&&record.spokenSyllables.length);
  const effectiveCount=prepared.reduce((sum,record)=>sum+record.weight,0);
  const reminder='<div class="pronunciationAnalysisNote">本結果依瀏覽器語音辨識文字自動推測，僅供教師安排發音練習參考，不作為構音或醫療診斷。</div>';
  if(effectiveCount<5)return "";
  const directionStats=new Map();
  const recordHits=new Map();
  const multiSyllable={label:"多音節語句",count:0,examples:[],typeCounts:{漏字:0,增字:0,音節替換:0,音節順序改變:0,只說出部分內容:0}};
  const addExample=(item,record)=>{
    if(!item.examples.some(existing=>existing.target===record.target&&existing.input===record.input)&&item.examples.length<8)item.examples.push({target:record.target,input:record.input});
  };
  const addDirection=(rule,part,from,to,weight,record,recordIndex)=>{
    const key=`${part}:${from}>${to}`;
    if(!directionStats.has(key))directionStats.set(key,{key,part,from,to,familyLabels:new Set(),label:pronunciationDirectionLabel(part,from,to),count:0,examples:[],recordIds:new Set()});
    const item=directionStats.get(key);
    item.familyLabels.add(rule.label);
    item.count+=weight;item.recordIds.add(recordIndex);addExample(item,record);
    if(!recordHits.has(recordIndex))recordHits.set(recordIndex,new Set());
    recordHits.get(recordIndex).add(key);
  };
  prepared.forEach((record,recordIndex)=>{
    const aligned=alignPronunciationSyllables(record.targetSyllables,record.spokenSyllables);
    aligned.forEach(pair=>{
      if(pair.type!=="pair"||!pair.target||!pair.spoken)return;
      PRONUNCIATION_CONFUSION_RULES.forEach(rule=>{
        const left=pair.target[rule.part],right=pair.spoken[rule.part];
        if(left===right||!rule.members.has(left)||!rule.members.has(right))return;
        if(rule.part==="initial"&&!pronunciationFinalsClose(pair.target.final,pair.spoken.final))return;
        if(rule.part==="initial")addDirection(rule,"sound",left,right,record.weight,record,recordIndex);
        else if(pair.target.rhyme!==pair.spoken.rhyme)addDirection(rule,"rhyme",pair.target.rhyme,pair.spoken.rhyme,record.weight,record,recordIndex);
      });
      if(pair.target.medial!==pair.spoken.medial&&pair.target.rhyme===pair.spoken.rhyme){
        addDirection({label:"介符"},"medial",pair.target.medial,pair.spoken.medial,record.weight,record,recordIndex);
      }
    });
    if(record.targetSyllables.length>=3){
      const deletionCount=aligned.filter(item=>item.type==="delete").length;
      const insertionCount=aligned.filter(item=>item.type==="insert").length;
      const substitutionCount=aligned.filter(item=>item.type==="pair"&&item.target&&item.spoken&&item.target.plain!==item.spoken.plain).length;
      const targetOrder=record.targetSyllables.map(item=>item.plain).join("|");
      const spokenOrder=record.spokenSyllables.map(item=>item.plain).join("|");
      const sameMembers=record.targetSyllables.length===record.spokenSyllables.length&&[...record.targetSyllables].map(item=>item.plain).sort().join("|")===[...record.spokenSyllables].map(item=>item.plain).sort().join("|");
      const orderChanged=sameMembers&&targetOrder!==spokenOrder;
      const partialAnswer=record.spokenSyllables.length<=Math.max(1,Math.floor(record.targetSyllables.length*.65));
      const types=[];
      if(deletionCount)types.push("漏字");
      if(insertionCount)types.push("增字");
      if(substitutionCount)types.push("音節替換");
      if(orderChanged)types.push("音節順序改變");
      if(partialAnswer)types.push("只說出部分內容");
      if(types.length){
        multiSyllable.count+=record.weight;addExample(multiSyllable,record);
        types.forEach(type=>multiSyllable.typeCounts[type]+=record.weight);
      }
    }
  });
  const phonetic=mergeRelatedPronunciationStats([...directionStats.values()].filter(item=>item.count>=3))
    .sort((a,b)=>b.count-a.count||a.label.localeCompare(b.label,"zh-Hant"))
    .slice(0,2);
  const ranked=[...phonetic];
  if(multiSyllable.count>=3)ranked.push(multiSyllable);
  ranked.sort((a,b)=>b.count-a.count||a.label.localeCompare(b.label,"zh-Hant"));
  ranked.forEach((item,index)=>item.rank=index+1);
  if(!ranked.length)return "";
  const rows=ranked.map(item=>{
    const teaching=pronunciationTeachingContent(item);
    const frequent=pronunciationFrequentSummary(item.examples);
    const typeSummary=item.label==="多音節語句"?Object.entries(item.typeCounts).filter(([,count])=>count>0).sort((a,b)=>b[1]-a[1]).map(([type,count])=>`${type}${count}次`).join("、"):"";
    const details=[
      frequent?`<div class="pronunciationAnalysisDetailLine"><b>錯誤摘要：</b>${esc(frequent)}</div>`:"",
      typeSummary?`<div class="pronunciationAnalysisDetailLine"><b>錯誤類型：</b>${esc(typeSummary)}</div>`:"",
      teaching.practice.length?`<div class="pronunciationAnalysisDetailLine"><b>建議練習：</b>${esc(teaching.practice.join("、"))}</div>`:""
    ].filter(Boolean).join("");
    return `<div class="pronunciationAnalysisRow"><span>${item.rank}.</span><b>${esc(item.label)}</b><span>${esc(item.countText||`${item.count}次`)}</span><span>${esc(item.examples[0]?pronunciationExampleText(item.examples[0]):"—")}</span></div><div class="pronunciationAnalysisDetail">${details}</div>`;
  }).join("");
  return `<div class="pronunciationAnalysis"><div class="pronunciationAnalysisTitle">可能的發音困難分析</div><div class="pronunciationAnalysisTable"><div class="pronunciationAnalysisRow header"><span>順位</span><span>練習重點</span><span>出現次數</span><span>代表例子</span></div>${rows}</div>${reminder}</div>`;
}

function formatStudentInputRecords(data,writingLabel="書寫輸入"){
  const formatRecords=records=>(Array.isArray(records)?records:[]).map(record=>{
    const item=record&&typeof record==="object"?record:{input:String(record||"")};
    if(item.correct===true)return "";
    const input=String(item.input||"").trim();
    if(!input)return "";
    const target=String(item.target||"").trim();
    return `<span>${target?`「${esc(target)}」→ `:""}${esc(input)}</span>`;
  }).filter(Boolean).join("、");
  const writingInputs=formatRecords(data&&data.writingInputRecords);
  const speechInputs=formatRecords(data&&data.speechInputRecords);
  return [
    writingInputs?`<div><b>${esc(writingLabel)}：</b>${writingInputs}</div>`:"",
    speechInputs?`<div><b>語音輸入：</b>${speechInputs}</div>`:""
  ].filter(Boolean).join("")||"—";
}

function replaceResultCacheForTasks(taskIds,docs){
  taskIds.forEach(taskId=>resultDocsByTask.delete(taskId));
  docs.forEach(doc=>{
    const taskId=String(doc.data().taskId||"");
    if(!taskId)return;
    if(!resultDocsByTask.has(taskId))resultDocsByTask.set(taskId,[]);
    resultDocsByTask.get(taskId).push(doc);
  });
}

function resultUpdatedMillis(doc){
  const data=doc&&typeof doc.data==="function"?doc.data():{};
  const value=data.updatedAt||data.completedAt||data.startedAt;
  if(value&&typeof value.toMillis==="function")return value.toMillis();
  if(value&&typeof value.seconds==="number")return value.seconds*1000;
  return 0;
}

function getCachedTaskResultDocs(taskId){
  if(resultCacheError)throw new Error(resultCacheError);
  return resultDocsByTask.get(taskId)||[];
}

function scheduleRender(){
  if(resultRefreshTimer)clearTimeout(resultRefreshTimer);
  resultRefreshTimer=setTimeout(async()=>{
    resultRefreshTimer=null;
    if(!user||!tasksListenerReady)return;
    try{await render(latestTaskDocs)}
    catch(e){$("taskList").innerHTML='<div class="status err">'+esc(e.message||e)+'</div>'}
  },180);
}

function stopResultListeners(clearExpanded=false){
  resultListenerGeneration++;
  resultUnsubs.forEach(fn=>fn());
  resultUnsubs.clear();
  expandedTaskLoading=false;
  if(clearExpanded)expandedTaskId="";
}

function resultTaskDocsForActiveMode(){
  if(activeMode==="click")return latestTaskDocs.filter(doc=>doc.data().taskMode==="click");
  if(activeMode==="hanzi")return latestTaskDocs.filter(doc=>doc.data().taskMode==="hanzi"&&!doc.data().hanziSpeechEnabled);
  if(activeMode==="speaking")return latestTaskDocs.filter(doc=>doc.data().taskMode==="speaking"||(doc.data().taskMode==="hanzi"&&doc.data().hanziSpeechEnabled));
  if(activeMode==="reading")return latestTaskDocs.filter(doc=>doc.data().taskMode==="reading");
  return [];
}

function taskResultsPanel(taskId,content){
  const open=expandedTaskId===taskId;
  const buttonText=open?"收合學生結果":"展開學生結果";
  const body=open
    ? (expandedTaskLoading?'<div class="taskResultLoading">正在載入最近 100 筆學生結果…</div>':content)
    : "";
  return `<button class="s taskResultToggle" type="button" aria-expanded="${open}" onclick="toggleTaskResults('${taskId}')">${buttonText}</button><div class="taskResultPanel${open?'':' hidden'}">${body}</div>`;
}

function startTaskResultListener(taskId){
  if(!user||!taskId||resultUnsubs.has(taskId))return;
  expandedTaskLoading=true;
  resultCacheError="";
  const generation=resultListenerGeneration;
  const stop=db.collection("taskResults")
    .where("teacherId","==",user.uid)
    .where("taskId","==",taskId)
    .onSnapshot(snap=>{
      if(generation!==resultListenerGeneration||expandedTaskId!==taskId)return;
      const recentDocs=[...snap.docs]
        .sort((a,b)=>resultUpdatedMillis(b)-resultUpdatedMillis(a))
        .slice(0,100);
      replaceResultCacheForTasks([taskId],recentDocs);
      resultCacheError="";
      expandedTaskLoading=false;
      scheduleRender();
    },e=>{
      if(generation!==resultListenerGeneration||expandedTaskId!==taskId)return;
      console.error("學生狀態即時更新失敗",e);
      resultCacheError=e.message||String(e);
      expandedTaskLoading=false;
      scheduleRender();
    });
  resultUnsubs.set(taskId,stop);
}

window.toggleTaskResults=taskId=>{
  if(expandedTaskId===taskId){
    stopResultListeners(true);
    clearGamePlayerListeners(false);
    scheduleRender();
    return;
  }
  stopResultListeners();
  clearGamePlayerListeners(false);
  expandedTaskId=taskId;
  resultDocsByTask.delete(taskId);
  expandedTaskLoading=true;
  scheduleRender();
  const taskDoc=latestTaskDocs.find(doc=>doc.id===taskId);
  if(taskDoc&&taskDoc.data().taskMode==="game")listenGamePlayers(taskId);
  startTaskResultListener(taskId);
}

function clearGamePlayerListeners(clearCache=true){
  playerUnsubs.forEach(fn=>fn());
  playerUnsubs.clear();
  if(clearCache){
    gamePlayersCache.clear();
    gamePlayersLoaded.clear();
    gamePlayersLoading.clear();
  }
}

auth.onAuthStateChanged(async u=>{
  user=u;
  if(u){
    $("authCard").classList.add("hidden");
    $("taskCard").classList.remove("hidden");
    $("userArea").classList.remove("hidden");
    await firestorePersistenceReady;
    if(user===u)listen();
  }else{
    renderGeneration++;
    $("authCard").classList.remove("hidden");
    $("taskCard").classList.add("hidden");
    $("userArea").classList.add("hidden");
    if(unsub)unsub();
    stopResultListeners();
    unsub=null;latestTaskDocs=[];tasksListenerReady=false;expandedTaskId="";expandedTaskLoading=false;
    resultDocsByTask=new Map();resultCacheError="";
    if(resultRefreshTimer)clearTimeout(resultRefreshTimer);
    resultRefreshTimer=null;
    clearGamePlayerListeners();
  }
});

$("loginBtn").onclick=async()=>{
  try{await auth.signInWithEmailAndPassword($("email").value.trim(),$("password").value)}
  catch(e){status("authStatus","登入失敗：\n"+e.message,"err")}
};
$("logoutBtn").onclick=()=>window.close();

function studentURL(id){
  const u=new URL("student.html",location.href);
  u.searchParams.set("task",id);
  u.searchParams.set("v","3.6-github-speech-fix");
  return u.toString();
}
function showQR(id,title){
  const url=studentURL(id);
  $("qrTitle").textContent=title+"－QR Code";
  $("qrURL").textContent=url;
  $("qrCode").innerHTML="";
  new QRCode($("qrCode"),{text:url,width:260,height:260,correctLevel:QRCode.CorrectLevel.M});
  $("qrModal").classList.remove("hidden");
}
window.showQR=showQR;
function restoreTeacherPlatform(id){
  const u=new URL("teacher.html",location.href);
  u.searchParams.set("restoreTask",id);
  location.href=u.toString();
}
window.restoreTeacherPlatform=restoreTeacherPlatform;
$("closeBtn").onclick=()=>$("qrModal").classList.add("hidden");
$("copyBtn").onclick=()=>navigator.clipboard.writeText($("qrURL").textContent);

function listen(){
  if(unsub)unsub();
  stopResultListeners(true);
  if(resultRefreshTimer)clearTimeout(resultRefreshTimer);
  resultRefreshTimer=null;
  tasksListenerReady=false;
  resultDocsByTask=new Map();
  resultCacheError="";
  $("taskList").innerHTML='<div class="status">正在載入任務列表…</div>';
  unsub=db.collection("tasks").where("teacherId","==",user.uid).onSnapshot(
    s=>{latestTaskDocs=s.docs;tasksListenerReady=true;scheduleRender()},
    e=>$("taskList").innerHTML='<div class="status err">'+esc(e.message||e)+'</div>'
  );
}

async function refreshTasks(){
  const btn=$("refreshBtn");
  btn.disabled=true;btn.textContent="整理中…";
  try{
    await render(latestTaskDocs);
  }catch(e){$("taskList").innerHTML='<div class="status err">'+esc(e.message||e)+'</div>'}
  finally{btn.disabled=false;btn.textContent="重新整理"}
}
$("refreshBtn").onclick=refreshTasks;

const modeTabs=[...document.querySelectorAll(".modeTab")];
function applyModeFilter(){
  modeTabs.forEach(btn=>btn.setAttribute("aria-selected",String(btn.dataset.mode===activeMode)));
  const sections=[...document.querySelectorAll("#taskList .modeSection")];
  sections.forEach(section=>section.classList.toggle("hidden",section.dataset.mode!==activeMode));
  const oldEmpty=$("modeEmpty");if(oldEmpty)oldEmpty.remove();
  if(!sections.some(section=>section.dataset.mode===activeMode)){
    const names={click:"點選模式(聽)",speaking:"口語模式(說)",reading:"問答模式(讀)",hanzi:"書寫模式(寫)",game:"多人回答模式"};
    const empty=document.createElement("div");empty.id="modeEmpty";empty.className="status";empty.textContent="目前沒有「"+names[activeMode]+"」資料。";
    $("taskList").appendChild(empty);
  }
}
modeTabs.forEach(btn=>btn.addEventListener("click",()=>{
  const nextMode=btn.dataset.mode;
  if(nextMode===activeMode){applyModeFilter();return}
  activeMode=nextMode;
  stopResultListeners(true);
  clearGamePlayerListeners(false);
  applyModeFilter();
  scheduleRender();
}));

function getClickAverageSeconds(data){
  const seconds=Number(data.clickAverageReactionSeconds||0);
  if(Number.isFinite(seconds)&&seconds>0)return seconds;
  const legacyMilliseconds=Number(data.clickAverageReactionMs||0);
  return Number.isFinite(legacyMilliseconds)&&legacyMilliseconds>0?legacyMilliseconds/1000:0;
}

async function render(docs){
  const generation=++renderGeneration;
  const getTime=doc=>{
    const value=doc.data().createdAt;
    if(value&&typeof value.toMillis==="function")return value.toMillis();
    if(value&&typeof value.seconds==="number")return value.seconds*1000;
    return 0;
  };

  const newestFirst=[...docs].sort((a,b)=>getTime(b)-getTime(a));
  const teachingDocs=[];
  const gameDocs=newestFirst.filter(doc=>doc.data().taskMode==="game");
  const advancedDocs=newestFirst.filter(doc=>doc.data().taskMode==="advanced");
  const clickDocs=newestFirst.filter(doc=>doc.data().taskMode==="click");
  const speakingDocs=newestFirst.filter(doc=>doc.data().taskMode==="speaking"||(doc.data().taskMode==="hanzi"&&doc.data().hanziSpeechEnabled));
  const hanziDocs=newestFirst.filter(doc=>doc.data().taskMode==="hanzi"&&!doc.data().hanziSpeechEnabled);
  const readingDocs=newestFirst.filter(doc=>doc.data().taskMode==="reading");

  const renderTeachingTask=doc=>{
    const t=doc.data();
    const recognitionInfo=`<div class="meta">辨識方式：${recognitionEngineName(t.recognitionEngine)}</div>`;
    const descriptions=t.classDescriptions&&typeof t.classDescriptions==="object"
      ? t.classDescriptions
      : {};

    const itemInfo=(t.targetClasses||[]).map(name=>{
      const description=String(descriptions[name]||"").trim();
      return description
        ? `${esc(name)}：${esc(description)}`
        : esc(name);
    }).join("<br>");

    return `<div class="task teachingTask">
      <div class="top">
        <div>
          <span class="modeBadge">物品(文字)辨識教學模式</span>
          <div class="titleLine">
            <div class="title">${esc(t.title||"未命名物品(文字)辨識教學模式")}</div>
            <button class="s restoreTeacherBtn" type="button" onclick="restoreTeacherPlatform('${doc.id}')">回復教師平台</button>
          </div>
          ${recognitionInfo}
          <div class="meta">物品與說明：<br>${itemInfo||"尚無物品資料"}</div>
        </div>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="s" onclick="showQR('${doc.id}','${esc(t.title||"物品(文字)辨識教學模式")}')">重新產生 QR</button>
        <button class="d" onclick="delTask('${doc.id}')">完整刪除</button>
      </div>
    </div>`;
  };

  const renderGameTask=doc=>{
    const t=doc.data();
    const stateText={lobby:"等待學生加入",active:"遊戲進行中",finished:"遊戲已結束"}[t.gameStatus]||"等待學生加入";
    const audioItems=Array.isArray(t.audioRequiredClasses)
      ? t.audioRequiredClasses.filter(name=>(t.targetClasses||[]).includes(name))
      : [];
    const audioInfo=audioItems.length
      ? `<div class="meta">瀏覽器語音辨識（zh-TW）：${audioItems.map(esc).join("、")}</div>`
      : "";
    const speechStandardInfo=audioItems.length?speechRecognitionStandardInfo(t):"";
    const promptInfo=t.promptMode==="description"
      ? '<div class="meta">出題方式：說明文字出題</div>'
      : "";
    const slowSpeechInfo=taskToggleInfo("放慢語音速度",!!t.slowSpeechPlayback);
    return `<div class="task gameTask">
      <div class="top">
        <div>
          <span class="modeBadge">多人回答模式</span>
          <div class="titleLine">
            <div class="title">${esc(t.title||"未命名遊戲")}</div>
            <button class="s restoreTeacherBtn" type="button" onclick="restoreTeacherPlatform('${doc.id}')">回復教師平台</button>
          </div>
          ${promptInfo}
          ${slowSpeechInfo}
          <div class="meta">回答文字：${(t.targetClasses||[]).map(esc).join(" → ")}</div>
          ${speechStandardInfo}
          <span class="gameState" id="gameState_${doc.id}">${stateText}</span>
        </div>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="s" onclick="showQR('${doc.id}','${esc(t.title||"遊戲")}')">顯示遊戲 QR</button>
        <button class="s" onclick="exportStudentAssessment('${doc.id}')">匯出學生評量</button>
        <button class="w" onclick="clearTaskPhotos('${doc.id}')">只清除照片</button>
        <button class="p" onclick="startGame('${doc.id}')">全員開始</button>
        <button class="s" onclick="finishGame('${doc.id}')">結束遊戲</button>
        <button class="s" onclick="resetGame('${doc.id}')">重新開放</button>
        <button class="d" onclick="delTask('${doc.id}')">完整刪除</button>
      </div>
      ${taskResultsPanel(doc.id,`<div style="margin-top:14px"><b>學生等待室與即時排名</b></div><div id="gamePlayers_${doc.id}" class="small" style="padding-top:8px">正在載入學生…</div>`)}
    </div>`;
  };

  const renderEvaluationTask=async doc=>{
    const t=doc.data();
    const isAdvanced=t.taskMode==="advanced";
    const isReading=t.taskMode==="reading";
    const recognitionInfo=`<div class="meta">辨識方式：${recognitionEngineName(t.recognitionEngine)}</div>`;
    const workflowInfo=t.taskMode==="reading"||t.recognitionEngine==="ocr"&&t.skipPhotoRecognition?'<div class="meta">辨識流程：僅語音辨識（取消拍照辨識）</div>':"";
    let resultDocs=[],resultError="";

    try{
      resultDocs=getCachedTaskResultDocs(doc.id);
    }catch(e){
      resultError=e.message||String(e);
    }

    const rows=resultDocs.map(r=>{
      const d=r.data();
      const incorrectItems=Array.isArray(d.incorrectClasses)
        ? [...new Set(d.incorrectClasses.filter(Boolean))]
        : [];
      const incorrectAudioItems=Array.isArray(d.incorrectAudioClasses)
        ? [...new Set(d.incorrectAudioClasses.filter(Boolean))]
        : [];
      const skippedItems=Array.isArray(d.skippedClasses)
        ? [...new Set(d.skippedClasses.filter(Boolean))]
        : [];
      const hasTypedCounts=d.imageItemErrorCounts&&typeof d.imageItemErrorCounts==="object"||d.audioItemErrorCounts&&typeof d.audioItemErrorCounts==="object";
      const imageErrors=getItemErrorGroups(d,"imageItemErrorCounts",incorrectItems);
      const audioErrors=getItemErrorGroups(d,"audioItemErrorCounts",incorrectAudioItems);
      const legacyErrors=hasTypedCounts?{twoOnly:[],threeToFour:[],fiveOrMore:[]}:getItemErrorGroups(d,"itemErrorCounts",[...incorrectItems,...incorrectAudioItems],true);
      const incorrectText=[
        imageErrors.twoOnly.length?`拍照辨識：<span class="lowErrorMark">⚠ 答錯 1～2 次：${imageErrors.twoOnly.map(esc).join("、")}</span>`:"",
        imageErrors.threeToFour.length?`拍照辨識：<span class="errorCountMark">⚠ 答錯 3～4 次：${imageErrors.threeToFour.map(esc).join("、")}</span>`:"",
        imageErrors.fiveOrMore.length?`拍照辨識：<span class="fiveWrongMark">⚠ 答錯 5 次以上：${imageErrors.fiveOrMore.map(esc).join("、")}</span>`:"",
        audioErrors.twoOnly.length?`語音辨識：<span class="lowErrorMark">⚠ 答錯 1～2 次：${audioErrors.twoOnly.map(esc).join("、")}</span>`:"",
        audioErrors.threeToFour.length?`語音辨識：<span class="errorCountMark">⚠ 答錯 3～4 次：${audioErrors.threeToFour.map(esc).join("、")}</span>`:"",
        audioErrors.fiveOrMore.length?`語音辨識：<span class="fiveWrongMark">⚠ 答錯 5 次以上：${audioErrors.fiveOrMore.map(esc).join("、")}</span>`:"",
        legacyErrors.twoOnly.length?`<span class="lowErrorMark">⚠ 答錯 1～2 次：${legacyErrors.twoOnly.map(esc).join("、")}</span>`:"",
        legacyErrors.threeToFour.length?`<span class="errorCountMark">⚠ 答錯 3～4 次：${legacyErrors.threeToFour.map(esc).join("、")}</span>`:"",
        legacyErrors.fiveOrMore.length?`<span class="fiveWrongMark">⚠ 答錯 5 次以上：${legacyErrors.fiveOrMore.map(esc).join("、")}</span>`:""
      ].filter(Boolean).join("<br>");
      const hasFiveWrong=imageErrors.fiveOrMore.length||audioErrors.fiveOrMore.length||legacyErrors.fiveOrMore.length;
      const hasGeneralError=imageErrors.twoOnly.length||imageErrors.threeToFour.length||audioErrors.twoOnly.length||audioErrors.threeToFour.length||legacyErrors.twoOnly.length||legacyErrors.threeToFour.length;
      const studentInputs=formatStudentInputRecords(d,"書寫輸入");
      return `<div class="rr inputResultRow${hasFiveWrong?" hasFiveWrong":hasGeneralError?" hasAnyError":""}">
        <span>${esc(d.studentName||"未命名")}</span>
        <span>${d.progress||0}%</span>
        <span>${resultStatusText(d.status)}</span>
        <span>${incorrectText||"—"}</span>
        <span class="studentInputRecords">${studentInputs}</span>
      </div>`;
    }).join("");

    const resultSection=resultError
      ? `<div class="status err">${esc(resultError)}</div>`
      : `<div style="margin-top:12px">
          <b>學生完成度（${resultDocs.length} 人）</b>
          <div class="rr inputResultRow">
            <b>學生</b><b>進度</b><b>狀態</b><b>辨識錯誤</b><b>學生輸入文字</b>
          </div>
          ${rows||'<div class="small" style="padding:10px">尚無學生紀錄</div>'}
        </div>`;

    const audioItems=Array.isArray(t.audioRequiredClasses)
      ? t.audioRequiredClasses.filter(name=>(t.targetClasses||[]).includes(name))
      : [];
    const audioInfo=audioItems.length
      ? `<div class="meta">瀏覽器語音辨識（zh-TW）：${audioItems.map(esc).join("、")}</div>`
      : "";
    const speechStandardInfo=audioItems.length?speechRecognitionStandardInfo(t):"";

    const recognitionDisplayInfo=isReading?"":recognitionInfo;
    const workflowDisplayInfo=isReading?"":workflowInfo;
    const audioDisplayInfo=isReading?"":audioInfo;
    const autoSpeechInfo=isReading?taskToggleInfo("自動唸出題目",!t.disableAutoPromptSpeech):"";
    const slowSpeechInfo=isReading?taskToggleInfo("放慢語音速度",!!t.slowSpeechPlayback):"";
    const repeatPromptInfo=isReading?taskToggleInfo("錯誤後語音再唸一次",!!t.repeatPromptAfterSpeechError):"";
    const itemLabel=isReading?"練習文字":"物品";
    return `<div class="task ${isAdvanced?"advancedTask":isReading?"readingTask":"evaluationTask"}">
      <div class="top">
        <div>
          <span class="modeBadge">${isAdvanced?"進階評量模式":"問答模式(讀)"}</span>
          <div class="titleLine">
            <div class="title">${esc(t.title||(isAdvanced?"未命名進階評量":"未命名問答模式(讀)"))}</div>
            <button class="s restoreTeacherBtn" type="button" onclick="restoreTeacherPlatform('${doc.id}')">回復教師平台</button>
          </div>
          ${recognitionDisplayInfo}
          ${workflowDisplayInfo}
          <div class="meta">${itemLabel}：${(t.targetClasses||[]).map(esc).join(" → ")}</div>
          ${audioDisplayInfo}
          ${speechStandardInfo}
          ${autoSpeechInfo}
          ${slowSpeechInfo}
          ${repeatPromptInfo}
        </div>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="s" onclick="showQR('${doc.id}','${esc(t.title||(isAdvanced?"進階評量":"問答模式(讀)"))}')">重新產生 QR</button>
        <button class="s" onclick="exportStudentAssessment('${doc.id}')">匯出學生評量</button>
        <button class="w" onclick="clearTaskPhotos('${doc.id}')">只清除照片</button>
        <button class="d" onclick="delTask('${doc.id}')">完整刪除</button>
      </div>
      ${taskResultsPanel(doc.id,resultSection)}
    </div>`;
  };

  const renderClickTask=async doc=>{
    const t=doc.data();
    let resultDocs=[],resultError="";
    try{
      resultDocs=[...getCachedTaskResultDocs(doc.id)].sort((a,b)=>Number(a.data().studentCode||999)-Number(b.data().studentCode||999));
    }catch(e){resultError=e.message||String(e)}
    const studentRecords=resultDocs.map(resultDoc=>{
      const data=resultDoc.data();
      const averageSeconds=getClickAverageSeconds(data);
      const {twoOnly,threeToFour,fiveOrMore}=getItemErrorGroups(data,"clickItemErrorCounts");
      const errorDetails=[
        twoOnly.length?`<div><span class="lowErrorMark">⚠ 答錯 1～2 次：${twoOnly.map(esc).join("、")}</span></div>`:"",
        threeToFour.length?`<div><span class="errorCountMark">⚠ 答錯 3～4 次：${threeToFour.map(esc).join("、")}</span></div>`:"",
        fiveOrMore.length?`<div><span class="fiveWrongMark">⚠ 答錯 5 次以上：${fiveOrMore.map(esc).join("、")}</span></div>`:""
      ].filter(Boolean).join("");
      return `<div class="clickRecord">
        <b>${esc(data.studentName||("學生 "+(data.studentCode||"")))}</b>｜${resultStatusText(data.status)}｜答對 ${Number(data.clickCorrectCount||0)} 次｜答錯 ${Number(data.clickWrongCount||0)} 次｜逾時 ${Number(data.clickMissCount||0)} 次｜平均 ${averageSeconds?averageSeconds.toFixed(2):"—"} 秒
        ${errorDetails?`<div class="clickRecordErrors">${errorDetails}</div>`:""}
      </div>`;
    }).join("");
    const resultSection=resultError
      ? `<div class="status err">${esc(resultError)}</div>`
      : `<div style="margin-top:12px"><b>學生端點選紀錄（${resultDocs.length} 人）</b>${studentRecords||'<div class="small" style="padding:10px">尚無學生紀錄</div>'}</div>`;
    return `<div class="task clickTask">
      <div class="top"><div>
        <span class="modeBadge">點選模式(聽)</span>
        <div class="titleLine">
          <div class="title">${esc(t.title||"未命名點選模式(聽)")}</div>
          <button class="s restoreTeacherBtn" type="button" onclick="restoreTeacherPlatform('${doc.id}')">回復教師平台</button>
        </div>
        <div class="meta">文字：${(t.targetClasses||[]).map(esc).join("、")}</div>
        <div class="meta">出題方式：${t.promptMode==="description"?"說明文字出題":"名稱文字出題"}</div>
        <div class="meta">每個文字出現 ${Number(t.clickRepeatCount||3)} 次｜每次最多 ${Number(t.clickDisplaySeconds||5)} 秒</div>
      </div></div>
      <div class="row" style="margin-top:12px">
        <button class="s" onclick="showQR('${doc.id}','${esc(t.title||"點選模式(聽)")}')">重新產生 QR</button>
        <button class="s" onclick="exportStudentAssessment('${doc.id}')">匯出學生評量</button>
        <button class="d" onclick="delTask('${doc.id}')">完整刪除</button>
      </div>
      ${taskResultsPanel(doc.id,resultSection)}
    </div>`;
  };

  const renderHanziTask=async doc=>{
    const t=doc.data();let resultDocs=[],resultError="";
    const isSpeaking=t.taskMode==="speaking"||!!t.hanziSpeechEnabled;
    const isPractice=!isSpeaking&&(t.hanziPracticeEnabled===undefined?!t.hanziWritingEnabled:!!t.hanziPracticeEnabled);
    try{
      resultDocs=[...getCachedTaskResultDocs(doc.id)].sort((a,b)=>Number(a.data().studentCode||999)-Number(b.data().studentCode||999));
    }catch(e){resultError=e.message||String(e)}
    const rows=resultDocs.map(r=>{
      const d=r.data();
      const writtenWrong=[...new Set((d.incorrectClasses||[]).filter(Boolean))];
      const spokenWrong=[...new Set((d.incorrectAudioClasses||[]).filter(Boolean))];
      const incorrect=isSpeaking?spokenWrong:writtenWrong;
      const studentInputs=formatStudentInputRecords(d);
      const skipped=Array.isArray(d.skippedClasses)?[...new Set(d.skippedClasses.filter(Boolean))]:[];
      const errorField=isSpeaking
        ? (d.audioItemErrorCounts&&typeof d.audioItemErrorCounts==="object"?"audioItemErrorCounts":"itemErrorCounts")
        : (d.imageItemErrorCounts&&typeof d.imageItemErrorCounts==="object"?"imageItemErrorCounts":"itemErrorCounts");
      const {twoOnly,threeToFour,fiveOrMore}=getItemErrorGroups(d,errorField,incorrect,true);
      const recognitionLabel=isSpeaking?"語音辨識":"書寫辨識";
      const errors=[
        twoOnly.length?`${recognitionLabel}：<span class="lowErrorMark">⚠ 答錯 1～2 次：${twoOnly.map(esc).join("、")}</span>`:"",
        threeToFour.length?`${recognitionLabel}：<span class="errorCountMark">⚠ 答錯 3～4 次：${threeToFour.map(esc).join("、")}</span>`:"",
        fiveOrMore.length?`${recognitionLabel}：<span class="fiveWrongMark">⚠ 答錯 5 次以上：${fiveOrMore.map(esc).join("、")}</span>`:""
      ].filter(Boolean).join("<br>");
      const pronunciationAnalysis=isSpeaking?renderPronunciationAnalysis(d):"";
      return `<div class="rr inputResultRow${fiveOrMore.length?" hasFiveWrong":twoOnly.length||threeToFour.length?" hasAnyError":""}"><span>${esc(d.studentName||"未命名")}</span><span>${Number(d.progress||0)}%</span><span>${resultStatusText(d.status)}</span><span>${errors||"—"}</span><span class="studentInputRecords">${studentInputs}</span></div>${pronunciationAnalysis}`;
    }).join("");
    const resultSection=resultError?`<div class="status err">${esc(resultError)}</div>`:`<div style="margin-top:12px"><b>學生完成度（${resultDocs.length} 人）</b><div class="rr inputResultRow"><b>學生</b><b>進度</b><b>狀態</b><b>辨識錯誤</b><b>學生輸入文字</b></div>${rows||'<div class="small" style="padding:10px">尚無學生紀錄</div>'}</div>`;
    const settings=isSpeaking?`逐項完整文字語音辨識｜每題 ${Math.min(5,Math.max(1,Number(t.hanziRepeatCount||1)))} 次`:isPractice?"中英文書寫練習連結":"學生編號｜設備手寫輸入辨識｜結果回傳";
    const speechStandardInfo=isSpeaking?speechRecognitionStandardInfo(t):"";
    const autoSpeechInfo=isSpeaking?taskToggleInfo("自動唸出題目",!t.disableAutoPromptSpeech):"";
    const slowSpeechInfo=isSpeaking?taskToggleInfo("放慢語音速度",!!t.slowSpeechPlayback):"";
    const repeatPromptInfo=isSpeaking?taskToggleInfo("錯誤後語音再唸一次",!!t.repeatPromptAfterSpeechError):"";
    const practiceText=Array.isArray(t.hanziTexts)&&t.hanziTexts.length?t.hanziTexts.join("、"):String(t.hanziText||"").trim()||(t.targetClasses||[]).join("");
    const modeName=isSpeaking?"口語模式(說)":"書寫模式(寫)";
    const visibleResultSection=isPractice?"":taskResultsPanel(doc.id,resultSection);
    return `<div class="task ${isSpeaking?"speakingTask":"hanziTask"}"><div class="top"><div><span class="modeBadge">${modeName}</span><div class="titleLine"><div class="title">${esc(t.title||modeName)}</div><button class="s restoreTeacherBtn" type="button" onclick="restoreTeacherPlatform('${doc.id}')">回復教師平台</button></div><div class="meta">練習文字：${esc(practiceText)}</div><div class="meta">練習方式：${settings}</div>${speechStandardInfo}${autoSpeechInfo}${slowSpeechInfo}${repeatPromptInfo}</div></div><div class="row" style="margin-top:12px"><button class="s" onclick="showQR('${doc.id}','${esc(t.title||modeName)}')">重新產生 QR</button><button class="s" onclick="exportStudentAssessment('${doc.id}')">匯出學生評量</button><button class="d" onclick="delTask('${doc.id}')">完整刪除</button></div>${visibleResultSection}</div>`;
  };

  const sections=[];

  if(teachingDocs.length){
    sections.push('<section class="modeSection teaching" data-mode="teaching"><h2 class="modeTitle">物品(文字)辨識教學模式資訊</h2>');
    sections.push(teachingDocs.map(renderTeachingTask).join(""));
    sections.push('</section>');
  }

  if(hanziDocs.length){
    sections.push('<section class="modeSection hanzi" data-mode="hanzi"><h2 class="modeTitle">書寫模式(寫)</h2>');
    const hanziHtml=await Promise.all(hanziDocs.map(renderHanziTask));
    sections.push(hanziHtml.join(""));sections.push('</section>');
  }

  if(speakingDocs.length){
    sections.push('<section class="modeSection speaking" data-mode="speaking"><h2 class="modeTitle">口語模式(說)</h2>');
    const speakingHtml=await Promise.all(speakingDocs.map(renderHanziTask));
    sections.push(speakingHtml.join(""));sections.push('</section>');
  }

  if(readingDocs.length){
    sections.push('<section class="modeSection reading" data-mode="reading"><h2 class="modeTitle">問答模式(讀)</h2>');
    const readingHtml=await Promise.all(readingDocs.map(renderEvaluationTask));
    sections.push(readingHtml.join(""));sections.push('</section>');
  }

  if(advancedDocs.length){
    sections.push('<section class="modeSection advanced" data-mode="evaluation"><h2 class="modeTitle">進階評量模式資訊</h2>');
    const advancedHtml=await Promise.all(advancedDocs.map(renderEvaluationTask));
    sections.push(advancedHtml.join(""));
    sections.push('</section>');
  }

  if(gameDocs.length){
    sections.push('<section class="modeSection game" data-mode="game"><h2 class="modeTitle">多人回答模式</h2>');
    sections.push(gameDocs.map(renderGameTask).join(""));
    sections.push('</section>');
  }

  if(clickDocs.length){
    sections.push('<section class="modeSection click" data-mode="click"><h2 class="modeTitle">點選模式(聽)</h2>');
    const clickHtml=await Promise.all(clickDocs.map(renderClickTask));
    sections.push(clickHtml.join(""));
    sections.push('</section>');
  }

  if(generation!==renderGeneration)return;
  $("taskList").innerHTML=sections.join("");
  applyModeFilter();
  syncGamePlayerListeners(gameDocs);
}

function resultStatusText(status){
  return status==="completed"?"完成":status==="left"?"離開":"進行中";
}

function gameStatusText(status){
  return {pending:"等待同意",approved:"已同意",playing:"尋找中",completed:"已完成",left:"離開",rejected:"未通過"}[status]||status||"等待";
}

function renderGamePlayers(taskId,docs){
    const box=$("gamePlayers_"+taskId);if(!box)return;
    const players=docs.map(doc=>({id:doc.id,...doc.data()}));
    players.sort((a,b)=>{
      if(a.rank&&b.rank)return a.rank-b.rank;
      if(a.rank)return -1;if(b.rank)return 1;
      return Number(a.studentNumber||a.id)-Number(b.studentNumber||b.id);
    });
    if(!players.length){box.innerHTML='<div class="status">尚無學生加入。</div>';return}
    box.innerHTML=`<div class="playerRow"><span>號碼</span><span>狀態</span><span>名次</span><span>教師操作</span></div>`+players.map(p=>{
      const rank=p.rank?`第 ${p.rank} 名`:"—";
      const actions=p.status==="pending"
        ? `<div class="playerActions"><button class="p" onclick="approvePlayer('${taskId}','${p.id}')">同意</button><button class="d" onclick="rejectPlayer('${taskId}','${p.id}')">不同意</button></div>`
        : '<span class="small">—</span>';
      return `<div class="playerRow ${p.rank&&p.rank<=3?'rank'+p.rank:''}"><b>${esc(p.studentNumber||p.id)}</b><span>${gameStatusText(p.status)}</span><span>${rank}</span>${actions}</div>`;
    }).join("");
}

function listenGamePlayers(taskId){
  if(playerUnsubs.has(taskId)){
    if(gamePlayersCache.has(taskId))renderGamePlayers(taskId,gamePlayersCache.get(taskId));
    return;
  }
  const unsubPlayers=db.collection("tasks").doc(taskId).collection("gamePlayers").onSnapshot(snap=>{
    gamePlayersCache.set(taskId,snap.docs);
    renderGamePlayers(taskId,snap.docs);
  },e=>{const box=$("gamePlayers_"+taskId);if(box)box.innerHTML='<div class="status err">'+esc(e.message||e)+'</div>'});
  playerUnsubs.set(taskId,unsubPlayers);
}

function loadGamePlayersOnce(taskId){
  if(gamePlayersLoaded.has(taskId)){
    if(gamePlayersCache.has(taskId))renderGamePlayers(taskId,gamePlayersCache.get(taskId));
    return;
  }
  if(gamePlayersLoading.has(taskId))return;
  const loading=db.collection("tasks").doc(taskId).collection("gamePlayers").get()
    .then(snap=>{
      gamePlayersCache.set(taskId,snap.docs);
      gamePlayersLoaded.add(taskId);
      if(activeMode==="game")renderGamePlayers(taskId,snap.docs);
    })
    .catch(e=>{
      const box=$("gamePlayers_"+taskId);
      if(box&&activeMode==="game")box.innerHTML='<div class="status err">'+esc(e.message||e)+'</div>';
    })
    .finally(()=>gamePlayersLoading.delete(taskId));
  gamePlayersLoading.set(taskId,loading);
}

function syncGamePlayerListeners(gameDocs){
  if(activeMode!=="game"||!expandedTaskId){
    clearGamePlayerListeners(false);
    return;
  }
  const expandedDoc=gameDocs.find(doc=>doc.id===expandedTaskId);
  if(!expandedDoc){clearGamePlayerListeners(false);return}
  const currentIds=new Set([expandedTaskId]);
  const liveIds=new Set(expandedDoc.data().gameStatus!=="finished"?[expandedTaskId]:[]);
  [...playerUnsubs.entries()].forEach(([taskId,stop])=>{
    if(liveIds.has(taskId))return;
    stop();playerUnsubs.delete(taskId);
  });
  [...gamePlayersCache.keys()].forEach(taskId=>{
    if(currentIds.has(taskId))return;
    gamePlayersCache.delete(taskId);gamePlayersLoaded.delete(taskId);
  });
  [expandedDoc].forEach(doc=>{
    if(doc.data().gameStatus==="finished"){
      if(gamePlayersCache.has(doc.id)){
        gamePlayersLoaded.add(doc.id);
        renderGamePlayers(doc.id,gamePlayersCache.get(doc.id));
      }else loadGamePlayersOnce(doc.id);
      return;
    }
    listenGamePlayers(doc.id);
  });
}

window.approvePlayer=async(taskId,playerId)=>{
  const taskRef=db.collection("tasks").doc(taskId);
  const playerRef=taskRef.collection("gamePlayers").doc(playerId);
  try{
    await db.runTransaction(async tx=>{
      const taskSnap=await tx.get(taskRef);
      if(!taskSnap.exists||taskSnap.data().gameStatus!=="lobby")throw new Error("遊戲已開始，不能再同意新學生");
      tx.update(playerRef,{status:"approved",approvedAt:firebase.firestore.FieldValue.serverTimestamp()});
    });
  }catch(e){alert(e.message||e)}
};

window.rejectPlayer=async(taskId,playerId)=>{
  await db.collection("tasks").doc(taskId).collection("gamePlayers").doc(playerId).update({
    status:"rejected",rejectedAt:firebase.firestore.FieldValue.serverTimestamp()
  });
};

window.startGame=async taskId=>{
  const taskRef=db.collection("tasks").doc(taskId);
  const approved=await taskRef.collection("gamePlayers").where("status","==","approved").get();
  if(approved.empty){alert("請先同意至少一位學生加入遊戲。");return}
  if(!confirm(`確定讓 ${approved.size} 位學生同時開始尋找物品？`))return;
  await taskRef.collection("gameControl").doc("ranking").set({count:0});
  await taskRef.update({
    gameStatus:"active",
    gameFinishCount:0,
    gameStartedAt:firebase.firestore.FieldValue.serverTimestamp()
  });
};

window.finishGame=async taskId=>{
  if(!confirm("確定結束這場遊戲？"))return;
  await db.collection("tasks").doc(taskId).update({
    gameStatus:"finished",
    gameEndedAt:firebase.firestore.FieldValue.serverTimestamp()
  });
};

async function clearGamePlayers(taskId){
  const collection=db.collection("tasks").doc(taskId).collection("gamePlayers");
  while(true){
    const snap=await collection.limit(400).get();
    if(snap.empty)break;
    const batch=db.batch();snap.docs.forEach(doc=>batch.delete(doc.ref));await batch.commit();
    if(snap.size<400)break;
  }
  await db.collection("tasks").doc(taskId).collection("gameControl").doc("ranking").delete().catch(()=>{});
}

window.resetGame=async taskId=>{
  if(!confirm("重新開放會清除這場遊戲的等待名單與排名，確定繼續？"))return;
  await clearGamePlayers(taskId);
  await db.collection("tasks").doc(taskId).collection("gameControl").doc("ranking").set({count:0});
  await db.collection("tasks").doc(taskId).update({
    gameStatus:"lobby",gameFinishCount:0,
    gameStartedAt:firebase.firestore.FieldValue.delete(),
    gameEndedAt:firebase.firestore.FieldValue.delete()
  });
};

async function deleteDocsInBatches(docs,size=400){
  for(let start=0;start<docs.length;start+=size){
    const batch=db.batch();
    docs.slice(start,start+size).forEach(doc=>batch.delete(doc.ref));
    await batch.commit();
  }
}

async function deleteEvidenceForResult(resultDoc){
  let deleted=0;
  while(true){
    const snap=await resultDoc.ref.collection("evidence").limit(400).get();
    if(snap.empty)break;
    await deleteDocsInBatches(snap.docs);
    deleted+=snap.size;
    if(snap.size<400)break;
  }
  return deleted;
}

function csvErrorRange(data,min,max,mode=""){
  const inRange=count=>count>=min&&(max===Infinity||count<=max);
  const formatEntries=(field,label)=>{
    const source=data&&data[field];
    if(!source||typeof source!=="object"||Array.isArray(source))return {text:"",names:[]};
    const entries=Object.entries(source)
      .map(([name,count])=>[String(name).trim(),Math.max(0,Number(count)||0)])
      .filter(([name,count])=>name&&inRange(count));
    return {
      text:entries.length?`${label}${entries.map(([name,count])=>`${name}（${count} 次）`).join("、")}`:"",
      names:entries.map(([name])=>name)
    };
  };
  if(mode==="click")return formatEntries("clickItemErrorCounts","").text;
  const hasTypedCounts=data&&(
    data.imageItemErrorCounts&&typeof data.imageItemErrorCounts==="object"||
    data.audioItemErrorCounts&&typeof data.audioItemErrorCounts==="object"
  );
  const parts=[];
  const listed=new Set();
  if(hasTypedCounts){
    const image=formatEntries("imageItemErrorCounts",data.taskMode==="hanzi"?"書寫辨識：":"拍照辨識：");
    const audio=formatEntries("audioItemErrorCounts","語音辨識：");
    if(image.text)parts.push(image.text);
    if(audio.text)parts.push(audio.text);
    [...image.names,...audio.names].forEach(name=>listed.add(name));
  }else{
    const all=formatEntries("itemErrorCounts","");
    if(all.text)parts.push(all.text);
    all.names.forEach(name=>listed.add(name));
    if(!all.text){
      const legacyItems=[...new Set([...(data.incorrectClasses||[]),...(data.incorrectAudioClasses||[])].filter(Boolean).map(String))];
      const total=Math.max(0,Number(data.errorCount)||0);
      if(legacyItems.length===1&&inRange(total)){
        parts.push(`${legacyItems[0]}（${total} 次）`);
        listed.add(legacyItems[0]);
      }
    }
  }
  if(min>=5&&Array.isArray(data&&data.skippedClasses)){
    const skipped=[...new Set(data.skippedClasses.filter(Boolean).map(String))].filter(name=>!listed.has(name));
    if(skipped.length)parts.push(`其他：${skipped.map(name=>`${name}（5 次以上）`).join("、")}`);
  }
  return parts.join("；");
}

function csvTaskMode(task){
  if(task&&task.taskMode==="click")return "click";
  if(task&&task.taskMode==="game")return "game";
  if(task&&(task.taskMode==="speaking"||task.taskMode==="hanzi"&&task.hanziSpeechEnabled))return "speaking";
  if(task&&task.taskMode==="hanzi")return "hanzi";
  if(task&&task.taskMode==="reading")return "reading";
  return "evaluation";
}

function csvTotalErrorCount(data,mode){
  const explicit=Number(data&&data.errorCount);
  if(Number.isFinite(explicit)&&explicit>=0)return explicit;
  if(mode==="click")return Math.max(0,Number(data&&data.clickWrongCount)||0)+Math.max(0,Number(data&&data.clickMissCount)||0);
  const typedFields=["imageItemErrorCounts","audioItemErrorCounts"];
  let total=0,hasTyped=false;
  typedFields.forEach(field=>{
    const source=data&&data[field];
    if(!source||typeof source!=="object"||Array.isArray(source))return;
    hasTyped=true;
    total+=Object.values(source).reduce((sum,count)=>sum+Math.max(0,Number(count)||0),0);
  });
  if(hasTyped)return total;
  const legacy=data&&data.itemErrorCounts;
  if(legacy&&typeof legacy==="object"&&!Array.isArray(legacy))return Object.values(legacy).reduce((sum,count)=>sum+Math.max(0,Number(count)||0),0);
  return Math.max(0,Number(data&&data.attempts)||0);
}

function csvIncorrectItems(data,mode){
  if(mode==="click"){
    const source=data&&data.clickItemErrorCounts;
    if(!source||typeof source!=="object"||Array.isArray(source))return "";
    return Object.entries(source)
      .map(([name,count])=>[String(name).trim(),Math.max(0,Number(count)||0)])
      .filter(([name,count])=>name&&count>0)
      .map(([name])=>name)
      .join("、");
  }
  const written=Array.isArray(data&&data.incorrectClasses)?[...new Set(data.incorrectClasses.filter(Boolean).map(String))]:[];
  const spoken=Array.isArray(data&&data.incorrectAudioClasses)?[...new Set(data.incorrectAudioClasses.filter(Boolean).map(String))]:[];
  if(mode==="speaking"||mode==="reading")return spoken.join("、");
  if(mode==="hanzi")return written.join("、");
  return [
    written.length?`拍照辨識：${written.join("、")}`:"",
    spoken.length?`語音辨識：${spoken.join("、")}`:""
  ].filter(Boolean).join("；");
}

function csvPronunciationAnalysis(data){

function csvDefinitionForMode(mode){
  const base=["任務名稱","學生編號","學生名稱","完成進度","狀態","錯誤次數"];
  if(mode==="click")return [...base,"點選答對次數","點選答錯次數","點選逾時次數","平均點選時間(秒)"];
  const errors=["錯誤 1～2 次","錯誤 3～4 次","錯誤 5 次以上","辨識錯誤項目"];
  if(mode==="speaking")return [...base,...errors,"可能的發音困難分析"];
  if(mode==="game")return [...base,...errors,"遊戲名次"];
  return [...base,...errors];
}

function csvRowForMode(title,data,mode){
  const base=[
    title,data.studentCode||"",data.studentName||"",`${Number(data.progress||0)}%`,
    resultStatusText(data.status),csvTotalErrorCount(data,mode)
  ];
  if(mode==="click"){
    const averageSeconds=getClickAverageSeconds(data);
    return [...base,Number(data.clickCorrectCount||0),Number(data.clickWrongCount||0),Number(data.clickMissCount||0),averageSeconds?averageSeconds.toFixed(2):""];
  }
  const errors=[csvErrorRange(data,1,2),csvErrorRange(data,3,4),csvErrorRange(data,5,Infinity),csvIncorrectItems(data,mode)];
  if(mode==="speaking")return [...base,...errors,csvPronunciationAnalysis(data)];
  if(mode==="game")return [...base,...errors,data.gameRank?`第 ${data.gameRank} 名`:""];
  return [...base,...errors];
}

function assessmentLoadJSZip(){
  if(window.JSZip)return Promise.resolve(window.JSZip);
  const sources=[
    "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js",
    "https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"
  ];
  return new Promise((resolve,reject)=>{
    const load=index=>{
      if(index>=sources.length){reject(new Error("Word 匯出元件載入失敗，請確認網路後再試一次。"));return}
      const script=document.createElement("script");
      script.src=sources[index];script.async=true;
      script.onload=()=>window.JSZip?resolve(window.JSZip):load(index+1);
      script.onerror=()=>{script.remove();load(index+1)};
      document.head.appendChild(script);
    };
    load(0);
  });
}

function assessmentXml(value){
  return String(value??"")
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&apos;");
}

function assessmentWordRun(text,{bold=false,color="1F2937",size=20}={}){
  const content=String(text??"").split(/\r?\n/).map(assessmentXml).join('</w:t><w:br/><w:t xml:space="preserve">');
  return `<w:r><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:eastAsia="Microsoft JhengHei"/><w:sz w:val="${size}"/><w:szCs w:val="${size}"/><w:color w:val="${color}"/>${bold?"<w:b/><w:bCs/>":""}</w:rPr><w:t xml:space="preserve">${content}</w:t></w:r>`;
}

function assessmentWordParagraph(text,options={}){
  const {bold=false,color="1F2937",size=20,align="left",spaceBefore=0,spaceAfter=70,pageBreak=false}=options;
  const jc={left:"left",center:"center",right:"right"}[align]||"left";
  const content=pageBreak?'<w:r><w:br w:type="page"/></w:r>':assessmentWordRun(text,{bold,color,size});
  return `<w:p><w:pPr><w:jc w:val="${jc}"/><w:spacing w:before="${spaceBefore}" w:after="${spaceAfter}"/></w:pPr>${content}</w:p>`;
}

function assessmentWordCell(value,width,defaultOptions={}){
  const cell=value&&typeof value==="object"&&!Array.isArray(value)?value:{text:value};
  const fill=cell.fill||defaultOptions.fill||"FFFFFF";
  const color=cell.color||defaultOptions.color||"1F2937";
  const bold=cell.bold!==undefined?cell.bold:!!defaultOptions.bold;
  const align=cell.align||defaultOptions.align||"left";
  const size=cell.size||defaultOptions.size||18;
  const paragraphs=Array.isArray(cell.paragraphs)?cell.paragraphs:[cell.text??""];
  const content=paragraphs.map(text=>assessmentWordParagraph(text,{bold,color,size,align,spaceAfter:30})).join("");
  return `<w:tc><w:tcPr><w:tcW w:w="${width}" w:type="dxa"/><w:shd w:fill="${fill}"/><w:tcMar><w:top w:w="90" w:type="dxa"/><w:left w:w="110" w:type="dxa"/><w:bottom w:w="90" w:type="dxa"/><w:right w:w="110" w:type="dxa"/></w:tcMar><w:vAlign w:val="center"/></w:tcPr>${content}</w:tc>`;
}

function assessmentWordTable(rows,widths,{header=false,headerFill="1E3A5F",fontSize=18}={}){
  const grid=widths.map(width=>`<w:gridCol w:w="${width}"/>`).join("");
  const body=rows.map((row,rowIndex)=>{
    const options=rowIndex===0&&header?{bold:true,color:"FFFFFF",fill:headerFill,align:"center",size:fontSize}:{size:fontSize,fill:rowIndex%2?"F5F8FC":"FFFFFF"};
    return `<w:tr><w:trPr><w:cantSplit/></w:trPr>${row.map((cell,index)=>assessmentWordCell(cell,widths[index]||2000,options)).join("")}</w:tr>`;
  }).join("");
  return `<w:tbl><w:tblPr><w:tblW w:w="15300" w:type="dxa"/><w:tblLayout w:type="fixed"/><w:tblBorders><w:top w:val="single" w:sz="6" w:color="D6E2F0"/><w:left w:val="single" w:sz="6" w:color="D6E2F0"/><w:bottom w:val="single" w:sz="6" w:color="D6E2F0"/><w:right w:val="single" w:sz="6" w:color="D6E2F0"/><w:insideH w:val="single" w:sz="5" w:color="D6E2F0"/><w:insideV w:val="single" w:sz="5" w:color="D6E2F0"/></w:tblBorders></w:tblPr><w:tblGrid>${grid}</w:tblGrid>${body}</w:tbl>`;
}

function assessmentPlainText(html){
  const container=document.createElement("div");
  container.innerHTML=html||"";
  return String(container.textContent||"").replace(/[\t ]+/g," ").replace(/\n\s+/g,"\n").trim();
}

function assessmentModeName(task,mode){
  if(mode==="click")return "點選模式(聽)";
  if(mode==="speaking")return "口語模式(說)";
  if(mode==="reading")return "問答模式(讀)";
  if(mode==="hanzi")return "書寫模式(寫)";
  if(mode==="game")return "多人回答模式";
  return task&&task.taskMode==="advanced"?"進階評量模式":"評量任務";
}

function assessmentTaskSettings(task,mode){
  const yes=value=>value?"開啟":"關閉";
  const rows=[
    ["任務模式",assessmentModeName(task,mode)],
    ["練習文字",(task.targetClasses||[]).join("、")||"—"]
  ];
  if(mode==="click"){
    rows.push(
      ["出題方式",task.promptMode==="description"?"說明文字出題":"名稱文字出題"],
      ["顯示設定",`每項 ${Number(task.clickRepeatCount||3)} 次｜每次最多 ${Number(task.clickDisplaySeconds||5)} 秒｜同時 ${Number(task.clickSimultaneousCount||1)} 項`],
      ["放慢語音速度",yes(!!task.slowSpeechPlayback)]
    );
  }else if(mode==="hanzi"){
    const isPractice=task.hanziPracticeEnabled===undefined?!task.hanziWritingEnabled:!!task.hanziPracticeEnabled;
    rows.push(["練習方式",isPractice?"筆順練習":"書寫評量"]);
  }else{
    rows.push(
      ["出題方式",task.promptMode==="description"?"說明文字出題":"名稱文字出題"],
      ["語音辨識標準",task.relaxedSpeechRecognition?"高度放寬":"中度放寬"],
      ["語音模糊辨識",yes(!!task.fuzzySpeechRecognition)],
      ["自動唸出題目",yes(!task.disableAutoPromptSpeech)],
      ["辨識啟動",task.buttonSpeechRecognition?"按麥克風按鈕啟動":"自動啟動"],
      ["放慢語音速度",yes(!!task.slowSpeechPlayback)],
      ["錯誤後語音再唸一次",yes(!!task.repeatPromptAfterSpeechError)]
    );
  }
  return rows;
}

function assessmentStudentInputs(data,mode){
  if(mode==="click"){
    const average=getClickAverageSeconds(data);
    return `答對 ${Number(data.clickCorrectCount||0)} 次；答錯 ${Number(data.clickWrongCount||0)} 次；逾時 ${Number(data.clickMissCount||0)} 次${average?`；平均點選時間 ${average.toFixed(2)} 秒`:""}`;
  }
  const label=mode==="hanzi"?"書寫輸入":"語音輸入";
  return assessmentPlainText(formatStudentInputRecords(data,label))||"—";
}

function assessmentPronunciationRows(data){
  const html=renderPronunciationAnalysis(data);
  if(!html)return [];
  const container=document.createElement("div");
  container.innerHTML=html;
  return [...container.querySelectorAll(".pronunciationAnalysisRow:not(.header)")].map(row=>{
    const cells=[...row.children].map(cell=>String(cell.textContent||"").trim());
    const detail=row.nextElementSibling&&row.nextElementSibling.classList.contains("pronunciationAnalysisDetail")
      ? String(row.nextElementSibling.textContent||"").replace(/\s+/g," ").trim()
      : "";
    return [cells[0]||"",cells[1]||"",cells[2]||"",[cells[3]||"",detail].filter(Boolean).join("｜")];
  });
}

function assessmentStudentSection(data,mode,index){
  const name=data.studentName||data.studentCode&&`學生 ${data.studentCode}`||`學生 ${index+1}`;
  const progress=`${Number(data.progress||0)}%`;
  const status=resultStatusText(data.status);
  const errorCount=csvTotalErrorCount(data,mode);
  const range1=csvErrorRange(data,1,2,mode)||"—";
  const range2=csvErrorRange(data,3,4,mode)||"—";
  const range3=csvErrorRange(data,5,Infinity,mode)||"—";
  const incorrect=csvIncorrectItems(data,mode)||"—";
  const rank=mode==="game"&&data.gameRank?`第 ${data.gameRank} 名`:"—";
  const errorSectionTitle=mode==="click"?"點選答錯紀錄":"辨識錯誤";
  const errorRangeHeading=mode==="click"?"答錯次數":"錯誤級距";
  const errorItemHeading=mode==="click"?"題目文字":"項目";
  const allErrorItemsLabel=mode==="click"?"全部答錯題目":"辨識錯誤項目";
  const parts=[
    assessmentWordParagraph("",{pageBreak:true}),
    assessmentWordParagraph(`學生評量｜${name}`,{bold:true,color:"1E3A5F",size:32,spaceAfter:120}),
    assessmentWordTable([
      [{text:"學生編號",bold:true,fill:"DCEAFE"},data.studentCode||"—",{text:"完成進度",bold:true,fill:"DCEAFE"},progress,{text:"狀態",bold:true,fill:"DCEAFE"},status],
      [{text:"錯誤次數",bold:true,fill:"DCEAFE"},String(errorCount),{text:"遊戲名次",bold:true,fill:"DCEAFE"},rank,{text:"最後更新",bold:true,fill:"DCEAFE"},timestampText(data.updatedAt)||"—"]
    ],[1700,3100,1700,3100,1700,4000],{fontSize:18}),
    assessmentWordParagraph(errorSectionTitle,{bold:true,color:"1E3A5F",size:25,spaceBefore:140,spaceAfter:70}),
    assessmentWordTable([
      [{text:errorRangeHeading,bold:true},{text:errorItemHeading,bold:true}],
      [{text:"答錯 1～2 次",fill:"FFF7ED",color:"9A3412",bold:true},range1],
      [{text:"答錯 3～4 次",fill:"FFF1F2",color:"BE123C",bold:true},range2],
      [{text:"答錯 5 次以上",fill:"FEE2E2",color:"B91C1C",bold:true},range3],
      [{text:allErrorItemsLabel,fill:"F5F8FC",bold:true},incorrect]
    ],[3300,12000],{header:true,headerFill:"315D8A",fontSize:18}),
    assessmentWordParagraph("學生輸入文字",{bold:true,color:"1E3A5F",size:25,spaceBefore:140,spaceAfter:70}),
    assessmentWordTable([[{text:assessmentStudentInputs(data,mode),fill:"F8FBFF",paragraphs:assessmentStudentInputs(data,mode).split(/\s*｜\s*/)}]],[15300],{fontSize:18})
  ];
  const pronunciation=mode==="speaking"?assessmentPronunciationRows(data):[];
  if(pronunciation.length){
    parts.push(
      assessmentWordParagraph("可能的發音困難分析",{bold:true,color:"1E3A8A",size:25,spaceBefore:140,spaceAfter:70}),
      assessmentWordTable([["順位","練習重點","出現次數","代表例子與建議"],...pronunciation],[1200,3600,1900,8600],{header:true,headerFill:"3B82C4",fontSize:17}),
      assessmentWordParagraph("本結果依瀏覽器語音辨識文字自動推測，僅供教師安排發音練習參考，不作為構音或醫療診斷。",{color:"64748B",size:16,spaceBefore:70})
    );
  }
  return parts.join("");
}

function assessmentDocumentXml(task,title,mode,sorted){
  const generated=new Date().toLocaleString("zh-TW",{hour12:false});
  const settings=assessmentTaskSettings(task,mode);
  const summary=[
    ["學生","進度","狀態","錯誤次數",mode==="click"?"答錯題目":"辨識錯誤","學生輸入摘要"],
    ...sorted.map(doc=>{
      const data=doc.data();
      return [
        data.studentName||data.studentCode&&`學生 ${data.studentCode}`||"未命名",
        `${Number(data.progress||0)}%`,resultStatusText(data.status),String(csvTotalErrorCount(data,mode)),
        csvIncorrectItems(data,mode)||"—",assessmentStudentInputs(data,mode)||"—"
      ];
    })
  ];
  const body=[
    assessmentWordParagraph("學生評量報告",{bold:true,color:"1E3A5F",size:38,align:"center",spaceAfter:80}),
    assessmentWordParagraph(title,{bold:true,color:"111827",size:30,align:"center",spaceAfter:130}),
    assessmentWordTable([
      [{text:"評量項目",bold:true},{text:"內容",bold:true}],
      ...settings,
      ["學生人數",`${sorted.length} 人`],
      ["報告匯出時間",generated]
    ],[3600,11700],{header:true,headerFill:"1E3A5F",fontSize:18}),
    assessmentWordParagraph("學生完成摘要",{bold:true,color:"1E3A5F",size:27,spaceBefore:160,spaceAfter:80}),
    assessmentWordTable(summary,[2200,1300,1600,1500,3800,4900],{header:true,headerFill:"315D8A",fontSize:16}),
    assessmentWordParagraph("本報告由平台學習紀錄自動整理；語音辨識、錯誤次數與反應資料應搭配教師現場觀察綜合判讀。",{color:"64748B",size:16,spaceBefore:100})
  ];
  sorted.forEach((doc,index)=>body.push(assessmentStudentSection(doc.data(),mode,index)));
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body.join("")}<w:sectPr><w:pgSz w:w="16838" w:h="11906" w:orient="landscape"/><w:pgMar w:top="720" w:right="720" w:bottom="720" w:left="720" w:header="360" w:footer="360" w:gutter="0"/></w:sectPr></w:body></w:document>`;
}

async function assessmentCreateDocx(task,title,mode,sorted){
  const JSZip=await assessmentLoadJSZip();
  const zip=new JSZip();
  const now=new Date().toISOString();
  zip.file("[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/><Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/></Types>`);
  zip.folder("_rels").file(".rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/></Relationships>`);
  zip.folder("docProps").file("core.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${assessmentXml(title)}學生評量</dc:title><dc:creator>多感官互動學習任務製作平台</dc:creator><cp:lastModifiedBy>多感官互動學習任務製作平台</cp:lastModifiedBy><dcterms:created xsi:type="dcterms:W3CDTF">${now}</dcterms:created><dcterms:modified xsi:type="dcterms:W3CDTF">${now}</dcterms:modified></cp:coreProperties>`);
  zip.folder("docProps").file("app.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties" xmlns:vt="http://schemas.openxmlformats.org/officeDocument/2006/docPropsVTypes"><Application>Microsoft Office Word</Application><DocSecurity>0</DocSecurity><ScaleCrop>false</ScaleCrop><Company></Company><LinksUpToDate>false</LinksUpToDate><SharedDoc>false</SharedDoc><HyperlinksChanged>false</HyperlinksChanged><AppVersion>16.0000</AppVersion></Properties>`);
  const word=zip.folder("word");
  word.file("document.xml",assessmentDocumentXml(task,title,mode,sorted));
  word.file("styles.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:eastAsia="Microsoft JhengHei"/><w:sz w:val="20"/><w:szCs w:val="20"/><w:color w:val="1F2937"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="70" w:line="300" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style></w:styles>`);
  word.folder("_rels").file("document.xml.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`);
  return zip.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",compression:"DEFLATE",compressionOptions:{level:6}});
}

window.exportStudentAssessment=async taskId=>{
  try{
    const taskSnap=latestTaskDocs.find(doc=>doc.id===taskId);
    const resultDocs=await getTaskResultDocs(taskId);
    if(!resultDocs.length){alert("此任務目前沒有學生結果可以匯出。");return}
    const taskData=taskSnap?taskSnap.data():{};
    const title=taskData.title||"學生評量";
    const mode=csvTaskMode(taskData);
    const sorted=[...resultDocs].sort((a,b)=>Number(a.data().studentCode||999)-Number(b.data().studentCode||999));
    const blob=await assessmentCreateDocx(taskData,title,mode,sorted);
    const url=URL.createObjectURL(blob);
    const link=document.createElement("a");
    link.href=url;
    link.download=(title.replace(/[\\/:*?"<>|]/g,"_")||"學生評量")+"_學生評量.docx";
    document.body.appendChild(link);link.click();link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
  }catch(e){
    alert("匯出學生評量失敗：\n"+(e.message||e));
  }
};

window.delTask=async id=>{
  if(!confirm("確定完整刪除此任務？\n\n將一併刪除：\n・學生作答紀錄\n・所有辨識照片\n・遊戲學生名單與排名\n・任務本身\n\n刪除後無法復原，建議先匯出學生評量。"))return;
  try{
    const {resultDocs,photoCount}=await clearEvidenceForTask(id);
    await deleteDocsInBatches(resultDocs);
    await clearGamePlayers(id);
    await db.collection("tasks").doc(id).delete();
    alert(`完整刪除成功。\n已刪除 ${resultDocs.length} 筆學生紀錄與 ${photoCount} 張辨識照片。`);
  }catch(e){
    alert("完整刪除失敗：\n"+(e.message||e)+"\n\n請重新整理後再試一次。");
  }
};

function releaseTaskPageListeners(event){
  if(event&&event.persisted)return;
  if(unsub){unsub();unsub=null}
  stopResultListeners();
  clearGamePlayerListeners();
  if(resultRefreshTimer){clearTimeout(resultRefreshTimer);resultRefreshTimer=null}
}
window.addEventListener("pagehide",releaseTaskPageListeners);
window.addEventListener("beforeunload",releaseTaskPageListeners);
</script>
