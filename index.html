<style>
:root{
  --blue:#2563eb;--blue-dark:#1d4ed8;--indigo:#4f46e5;--teal:#0f766e;
  --violet:#7c3aed;--red:#dc2626;--ink:#172033;--muted:#64748b;
  --line:#dbe4ee;--page:#eef3f9;--surface:#fff;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#f6f9fd 0,#edf3f9 100%);font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;color:var(--ink);min-height:100vh}
header{background:rgba(255,255,255,.96);border-bottom:1px solid #dbe5f0;box-shadow:0 4px 18px rgba(15,23,42,.07);padding:13px 20px;position:sticky;top:0;z-index:20;backdrop-filter:blur(10px)}
.head{max-width:1180px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:12px}
.brandMark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;font-size:21px;font-weight:900;box-shadow:0 7px 18px rgba(37,99,235,.24)}
h1{margin:0;color:#17376b;font-size:22px;letter-spacing:.04em}
h2{margin:0 0 14px;font-size:20px}
main{max-width:1180px;margin:auto;padding:22px 18px 40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 8px 24px rgba(15,23,42,.065)}
.workspace{display:grid;gap:18px}.rightStack{display:grid;gap:16px;align-content:start}
@media(min-width:940px){.workspace{grid-template-columns:minmax(0,1.62fr) minmax(355px,.88fr)}}
input{width:100%;padding:12px 13px;border:1px solid #cbd5e1;border-radius:11px;background:#fff;color:var(--ink);font-size:16px;margin:6px 0;outline:none;transition:.18s}
input:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(59,130,246,.14)}
button,.navBtn{border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer;transition:transform .15s,box-shadow .15s,filter .15s}
button:hover,.navBtn:hover{transform:translateY(-1px);filter:brightness(.99)}
button:disabled{cursor:not-allowed;opacity:.58;transform:none}
.p{background:linear-gradient(135deg,#2563eb,#345de8);color:#fff;box-shadow:0 5px 13px rgba(37,99,235,.18)}
.s{background:#fff;color:var(--blue);border:1px solid #b7ccff}.d{background:#fff1f2;color:var(--red);border:1px solid #fecdd3}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.status{padding:11px 12px;border-radius:11px;background:#eff6ff;color:var(--blue-dark);white-space:pre-wrap;margin-top:11px;font-size:13px;line-height:1.55}
.ok{background:#ecfdf5;color:#166534}.err{background:#fef2f2;color:#b91c1c}.hidden{display:none!important}
.modelCard{min-height:650px;border-top:5px solid var(--blue)}
.modelCard>h2{color:#17376b}
.classBox{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;background:#f5f8fc;padding:11px 12px;border-radius:13px;margin:9px 0;cursor:grab;border:1px solid #e1e8f0;transition:.16s}
.classBox:hover{background:#f0f5fb;border-color:#c9d8e9}.classBox:active{cursor:grabbing}.classBox.dragging{opacity:.45;border-color:var(--blue)}.classBox.drag-over{border-color:var(--blue);background:#eff6ff}
.dragHandle{font-size:20px;color:#7890aa;user-select:none;margin-right:10px}
.classContent{display:grid;grid-template-columns:1fr;gap:8px;min-width:0}
.classMain{display:grid;grid-template-columns:minmax(90px,.48fr) minmax(170px,1fr);align-items:center;gap:10px;min-width:0}
.classLabel{display:flex;align-items:center;gap:8px;min-width:0;font-weight:800}
.classLabel input{width:auto;margin:0;accent-color:var(--blue)}
.classDescription{min-width:0;margin:0}
.classTools{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0;flex-wrap:wrap}
.thumbnailRow{display:flex;align-items:center;gap:9px;min-width:0;flex:0 0 auto}
.thumbnailDrop{width:132px;min-height:54px;border:2px dashed #b7c7dc;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px;cursor:pointer;color:#52677f;font-size:12px;font-weight:800;text-align:center;transition:.16s;outline:none}
.thumbnailDrop:hover,.thumbnailDrop:focus-visible,.thumbnailDrop.is-dragover{border-color:var(--blue);background:#eff6ff;color:var(--blue-dark)}
.thumbnailPreview{width:42px;height:42px;object-fit:cover;border-radius:8px;border:1px solid #dbe4ee;flex:0 0 auto}
.thumbnailRemove{padding:7px 10px;font-size:12px;min-width:auto}
.thumbnailInput{display:none}
.audioOptions{display:flex;justify-content:flex-end;align-items:center;max-width:100%;gap:7px 12px;flex-wrap:wrap;padding:8px 10px;border:1px solid #ddd6fe;border-radius:10px;background:#faf7ff;margin-left:auto}
.audioOption{display:flex;align-items:center;gap:5px;color:#4b2e1f;font-size:12px;font-weight:800;white-space:nowrap}
.audioOption input{width:auto;margin:0;accent-color:var(--violet)}
.task{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;background:#eef2f7}.top{display:flex;justify-content:space-between;gap:10px}.title{font-size:18px;font-weight:900}.meta,.small{font-size:13px;color:var(--muted);line-height:1.6}.badge{padding:4px 8px;border-radius:999px;background:#dbeafe;color:var(--blue-dark);font-size:12px;font-weight:800}.rr{display:grid;grid-template-columns:1.2fr .7fr .7fr .7fr;gap:8px;padding:8px;border-bottom:1px solid #eef2f7;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.62);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99}.box{background:#fff;border:1px solid var(--line);padding:22px;border-radius:18px;text-align:center;max-width:390px;width:100%;box-shadow:0 20px 55px rgba(15,23,42,.24)}.url{word-break:break-all;background:#f1f5f9;padding:10px;border-radius:8px;margin:10px 0}
.navBtn{display:inline-block;text-decoration:none;background:#fff;color:var(--blue);border:1px solid #b7ccff}
.modeCard{position:relative;overflow:hidden;margin:0;border-left-width:5px}
.modeCard::after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-38px;top:-38px;opacity:.08;background:currentColor}

#createTaskCard{background:#f4f5ff;border-color:#a5b4fc;color:#3730a3}

@media(max-width:700px){

  main{padding:14px 10px 28px}.card{padding:16px;border-radius:15px}

  .audioOptions{display:grid;grid-template-columns:1fr;width:100%;margin-left:0;padding:9px}
  .navBtn,button{padding:10px 12px}
}

</style>

<body>
<header><div class="head"><div class="brand"><div class="brandMark">AI</div><div><h1>教師平台</h1><div class="small">建立教學與評量・產生學生 QR Code</div></div></div><div id="userArea" class="hidden"><span id="userEmail" class="small"></span> <a class="navBtn" href="task.html" target="_blank" rel="noopener noreferrer">教學評量遊戲列表</a> <button id="logoutBtn" class="s">登出</button></div></div></header>
<main>
<section id="authCard" class="card">
  <h2>教師登入</h2>
  <div class="row">
    <input id="email" type="email" placeholder="教師 Email">

  <button id="loginBtn" class="p" style="width:100%;margin-top:10px">登入</button>
  <div id="authStatus" class="status">教師帳號請先由管理者在 Firebase Console 建立。</div>
</section>
<div id="app" class="hidden">
  <div class="workspace">
    <section class="card modelCard">
      <h2>載入 Teachable Machine 模型</h2>
      <input id="modelURL" placeholder="貼上 Image Model URL">
      <button id="loadModelBtn" class="p" style="width:100%">載入模型</button>
      <div id="modelStatus" class="status">尚未載入模型。</div>
      <div id="classes"></div>
    </section>

    <div class="rightStack">
      <section id="teachMode" class="card modeCard teachMode hidden">
        <h2>教學模式</h2>
        <input id="teachingTitle" placeholder="教學名稱">
        <button id="createTeachQRBtn" class="p" style="width:100%;margin-top:12px">產生學生教學 QR</button>

      </section>

      <section id="createTaskCard" class="card modeCard hidden">

        <button id="createAdvancedBtn" class="p" style="width:100%" disabled>產生進階評量 QR</button>
        <div id="advancedStatus" class="status">尚未建立。</div>

      <section id="gameModeCard" class="card modeCard gameMode hidden">

        <div class="gameHint">學生掃描 QR、選擇號碼並等待教師同意；教師統一開始後，依拍照辨識完成順序即時排名。</div>

</div>
</main>
<div id="qrModal" class="modal hidden"><div class="box"><h3 id="qrTitle">任務 QR Code</h3><div id="qrCode"></div><div id="qrURL" class="url"></div><div class="row"><button id="copyBtn" class="p">複製網址</button><button id="closeBtn" class="s">關閉</button></div></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyBbpIezLbQd2-e-3Z4pSdBLIFc_UlTPUy8",authDomain:"project-6540500202923576846.firebaseapp.com",projectId:"project-6540500202923576846",storageBucket:"project-6540500202923576846.firebasestorage.app",messagingSenderId:"516602165604",appId:"1:516602165604:web:b60f69ee56a4d49c416271"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();let user=null,model=null,modelURL="",labels=[],unsub=null,classThumbnails={};
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function status(id,msg,type=""){const e=$(id);e.textContent=msg;e.className="status "+type}
const TEACHER_DRAFT_PREFIX="teacherInputDraftV1:";
let restoringTeacherDraft=false,teacherDraftSaveTimer=null;
function teacherDraftKey(){return user?TEACHER_DRAFT_PREFIX+user.uid:""}
function normalizeDraftModelURL(value){const url=String(value||"").trim();return url&& !url.endsWith("/")?url+"/":url}
function readTeacherDraft(){
  const key=teacherDraftKey();
  if(!key)return null;
  try{
    const value=JSON.parse(localStorage.getItem(key)||"null");
    return value&&typeof value==="object"?value:null;
  }catch(e){
    console.warn("讀取教師輸入紀錄失敗",e);
    return null;
  }
}
function saveTeacherDraft(){
  if(!user||restoringTeacherDraft)return;
  const key=teacherDraftKey();
  if(!key)return;
  const previous=readTeacherDraft()||{};
  const boxes=[...document.querySelectorAll("#classes .classBox")];
  let items=previous.items&&typeof previous.items==="object"?previous.items:{};
  let order=Array.isArray(previous.order)?previous.order:[];
  let loadedModelURL=previous.loadedModelURL||"";
  if(boxes.length){
    items={};
    order=boxes.map(item=>item.dataset.label);
    loadedModelURL=normalizeDraftModelURL(modelURL);
    boxes.forEach(item=>{
      const label=item.dataset.label;
      const audio={};
      item.querySelectorAll(".audioCheck").forEach(check=>{
        audio[check.dataset.mode]=check.checked;
      });
      items[label]={
        selected:!!item.querySelector(".classLabel input[type='checkbox']")?.checked,
        description:item.querySelector(".classDescription")?.value||"",
        audio,
        thumbnail:/^data:image\/jpeg;base64,/i.test(classThumbnails[label]||"")
          ? classThumbnails[label]
          : ""
      };
    });
  }
  const draft={
    modelURLInput:$("modelURL").value,
    loadedModelURL,
    teachingTitle:$("teachingTitle").value,
    taskTitle:$("taskTitle").value,
    advancedTitle:$("advancedTitle").value,
    gameTitle:$("gameTitle").value,
    order,
    items,
    savedAt:Date.now()
  };
  try{
    localStorage.setItem(key,JSON.stringify(draft));
  }catch(e){
    console.warn("儲存教師輸入紀錄失敗",e);
  }
}
function scheduleTeacherDraftSave(){
  if(restoringTeacherDraft)return;
  if(teacherDraftSaveTimer)clearTimeout(teacherDraftSaveTimer);
  teacherDraftSaveTimer=setTimeout(()=>{
    teacherDraftSaveTimer=null;
    saveTeacherDraft();
  },180);
}
function restoreTeacherDraftBase(){
  const draft=readTeacherDraft();
  if(!draft)return false;
  restoringTeacherDraft=true;
  $("modelURL").value=String(draft.modelURLInput||"");
  $("teachingTitle").value=String(draft.teachingTitle||"");
  $("taskTitle").value=String(draft.taskTitle||"");
  $("advancedTitle").value=String(draft.advancedTitle||"");
  $("gameTitle").value=String(draft.gameTitle||"");
  restoringTeacherDraft=false;
  return true;
}
function restoreClassDraft(){
  const draft=readTeacherDraft();
  if(
    !draft||
    normalizeDraftModelURL(draft.loadedModelURL)!==normalizeDraftModelURL(modelURL)||
    !draft.items||
    typeof draft.items!=="object"
  )return false;
  restoringTeacherDraft=true;
  const container=$("classes");
  const boxes=[...container.querySelectorAll(".classBox")];
  const byLabel=new Map(boxes.map(item=>[item.dataset.label,item]));
  (Array.isArray(draft.order)?draft.order:[]).forEach(label=>{
    const item=byLabel.get(label);
    if(item)container.appendChild(item);
  });
  classThumbnails={};
  container.querySelectorAll(".classBox").forEach(item=>{
    const state=draft.items[item.dataset.label];
    if(!state||typeof state!=="object")return;
    const selected=item.querySelector(".classLabel input[type='checkbox']");
    const description=item.querySelector(".classDescription");
    if(selected)selected.checked=!!state.selected;
    if(description)description.value=String(state.description||"");
    item.querySelectorAll(".audioCheck").forEach(check=>{
      check.checked=!!state.audio?.[check.dataset.mode];
    });
    if(/^data:image\/jpeg;base64,/i.test(state.thumbnail||"")){
      classThumbnails[item.dataset.label]=state.thumbnail;
    }
    updateThumbnailUI(item);
  });
  updateLabelsFromDOM();
  restoringTeacherDraft=false;
  return true;
}
auth.onAuthStateChanged(u=>{user=u;if(u){$("authCard").classList.add("hidden");$("app").classList.remove("hidden");$("userArea").classList.remove("hidden");$("userEmail").textContent=u.email||"教師";restoreTeacherDraftBase()}else{$("authCard").classList.remove("hidden");$("app").classList.add("hidden");$("userArea").classList.add("hidden")}});
$("loginBtn").onclick=async()=>{try{await auth.signInWithEmailAndPassword($("email").value.trim(),$("password").value)}catch(e){status("authStatus","登入失敗：\n"+e.message,"err")}};
$("logoutBtn").onclick=()=>{saveTeacherDraft();auth.signOut()};
$("loadModelBtn").onclick=async()=>{$("createTaskCard").classList.add("hidden");$("advancedModeCard").classList.add("hidden");$("gameModeCard").classList.add("hidden");modelURL=$("modelURL").value.trim();if(!modelURL)return status("modelStatus","請輸入模型網址。","err");if(!modelURL.endsWith("/"))modelURL+="/";status("modelStatus","正在載入模型…");try{model=await tmImage.load(modelURL+"model.json",modelURL+"metadata.json");labels=model.getClassLabels();classThumbnails={};renderClassBoxes();initClassDragSort();restoreClassDraft();$("createBtn").disabled=false;$("createAdvancedBtn").disabled=false;$("createGameBtn").disabled=false;$("teachMode").classList.remove("hidden");$("advancedModeCard").classList.remove("hidden");$("createTaskCard").classList.remove("hidden");$("gameModeCard").classList.remove("hidden");status("modelStatus","模型載入成功，共 "+labels.length+" 類。可拖拉或點擊加入縮圖。","ok");saveTeacherDraft()}catch(e){status("modelStatus","模型載入失敗：\n"+e.message,"err")}};

function renderClassBoxes(){
  $("classes").innerHTML=labels.map((x,i)=>`<div class="classBox" draggable="true" data-label="${esc(x)}">
    <span class="dragHandle">☰</span>
    <div class="classContent">
      <div class="classMain">
        <label class="classLabel"><input type="checkbox" value="${esc(x)}" id="c${i}"> ${esc(x)}</label>
        <input class="classDescription" type="text" placeholder="輸入「${esc(x)}」的說明文字" aria-label="${esc(x)}的說明">
      </div>
      <div class="classTools">
        <div class="thumbnailRow">
          <div class="thumbnailDrop" role="button" tabindex="0" aria-label="上傳${esc(x)}的縮圖">
            <img class="thumbnailPreview hidden" alt="${esc(x)}縮圖">
            <span class="thumbnailPrompt">拖拉照片或點擊上傳縮圖</span>
          </div>
          <input class="thumbnailInput" type="file" accept="image/*">
          <button class="thumbnailRemove d hidden" type="button">刪除縮圖</button>
        </div>
        <div class="audioOptions"></div>
      </div>
    </div>
  </div>`).join("");
  refreshAudioOptions();
  initThumbnailUploads();
}

function resizeThumbnail(file){
  return new Promise((resolve,reject)=>{
    if(!file||!file.type.startsWith("image/")){
      reject(new Error("請選擇照片檔案。"));
      return;
    }
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error("照片讀取失敗。"));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error("無法開啟這張照片。"));
      img.onload=()=>{
        const canvas=document.createElement("canvas");
        const ctx=canvas.getContext("2d");
        const side=Math.min(img.naturalWidth,img.naturalHeight);
        const sx=(img.naturalWidth-side)/2;
        const sy=(img.naturalHeight-side)/2;
        canvas.width=120;
        canvas.height=120;
        ctx.drawImage(img,sx,sy,side,side,0,0,120,120);
        resolve(canvas.toDataURL("image/jpeg",0.75));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function updateThumbnailUI(item){
  const label=item.dataset.label;
  const dataURL=classThumbnails[label]||"";
  const preview=item.querySelector(".thumbnailPreview");
  const prompt=item.querySelector(".thumbnailPrompt");
  const removeBtn=item.querySelector(".thumbnailRemove");
  if(dataURL){
    preview.src=dataURL;
    preview.classList.remove("hidden");
    prompt.textContent="更換縮圖";
    removeBtn.classList.remove("hidden");
  }else{
    preview.removeAttribute("src");
    preview.classList.add("hidden");
    prompt.textContent="拖拉照片或點擊上傳縮圖";
    removeBtn.classList.add("hidden");
  }
}

async function handleThumbnailFile(item,file){
  const drop=item.querySelector(".thumbnailDrop");
  const prompt=item.querySelector(".thumbnailPrompt");
  const originalText=prompt.textContent;
  drop.classList.remove("is-dragover");
  prompt.textContent="正在處理照片…";
  try{
    classThumbnails[item.dataset.label]=await resizeThumbnail(file);
    updateThumbnailUI(item);
    scheduleTeacherDraftSave();
  }catch(e){
    prompt.textContent=originalText;
    status("modelStatus","縮圖上傳失敗：\n"+(e.message||e),"err");
  }
}

function initThumbnailUploads(){
  document.querySelectorAll("#classes .classBox").forEach(item=>{
    const drop=item.querySelector(".thumbnailDrop");
    const input=item.querySelector(".thumbnailInput");
    const removeBtn=item.querySelector(".thumbnailRemove");
    const openPicker=()=>input.click();
    drop.addEventListener("click",openPicker);
    drop.addEventListener("keydown",e=>{
      if(e.key==="Enter"||e.key===" "){
        e.preventDefault();
        openPicker();
      }
    });
    ["dragenter","dragover"].forEach(type=>drop.addEventListener(type,e=>{
      e.preventDefault();
      e.stopPropagation();
      drop.classList.add("is-dragover");
      if(e.dataTransfer)e.dataTransfer.dropEffect="copy";
    }));
    ["dragleave","dragend"].forEach(type=>drop.addEventListener(type,e=>{
      e.preventDefault();
      e.stopPropagation();
      drop.classList.remove("is-dragover");
    }));
    drop.addEventListener("drop",e=>{
      e.preventDefault();
      e.stopPropagation();
      const file=e.dataTransfer?.files?.[0];
      if(file)handleThumbnailFile(item,file);
    });
    input.addEventListener("change",()=>{
      const file=input.files?.[0];
      if(file)handleThumbnailFile(item,file);
      input.value="";
    });
    removeBtn.addEventListener("click",e=>{
      e.preventDefault();
      e.stopPropagation();
      delete classThumbnails[item.dataset.label];
      updateThumbnailUI(item);
      scheduleTeacherDraftSave();
    });
    updateThumbnailUI(item);
  });
}

function initClassDragSort(){const container=$("classes");let dragged=null;container.querySelectorAll(".classBox").forEach(item=>{item.addEventListener("dragstart",e=>{dragged=item;item.classList.add("dragging");e.dataTransfer.effectAllowed="move"});item.addEventListener("dragend",()=>{item.classList.remove("dragging");container.querySelectorAll(".classBox").forEach(x=>x.classList.remove("drag-over"));dragged=null;updateLabelsFromDOM();scheduleTeacherDraftSave()});item.addEventListener("dragover",e=>{e.preventDefault();if(item!==dragged)item.classList.add("drag-over")});item.addEventListener("dragleave",()=>item.classList.remove("drag-over"));item.addEventListener("drop",e=>{e.preventDefault();item.classList.remove("drag-over");if(!dragged||dragged===item)return;const r=item.getBoundingClientRect();container.insertBefore(dragged,e.clientY<r.top+r.height/2?item:item.nextSibling);updateLabelsFromDOM();scheduleTeacherDraftSave()})})}
function updateLabelsFromDOM(){labels=[...document.querySelectorAll("#classes .classBox")].map(item=>item.dataset.label)}
function getSelectedClassesInCurrentOrder(){return [...document.querySelectorAll("#classes .classBox")].filter(item=>item.querySelector('input[type="checkbox"]')?.checked).map(item=>item.dataset.label)}
function getClassDescriptions(selectedOnly=false){
  const descriptions={};
  document.querySelectorAll("#classes .classBox").forEach(item=>{
    const checkbox=item.querySelector('input[type="checkbox"]');
    if(selectedOnly&&!checkbox?.checked)return;
    const label=item.dataset.label;
    const description=item.querySelector(".classDescription")?.value.trim()||"";
    descriptions[label]=description;
  });
  return descriptions;
}
function getClassThumbnails(selectedOnly=false){
  const thumbnails={};
  document.querySelectorAll("#classes .classBox").forEach(item=>{
    const checkbox=item.querySelector('input[type="checkbox"]');
    if(selectedOnly&&!checkbox?.checked)return;
    const thumbnail=classThumbnails[item.dataset.label];
    if(thumbnail)thumbnails[item.dataset.label]=thumbnail;
  });
  return thumbnails;
}
function getAudioTargets(mode,selectedTargets){
  const selectedSet=new Set(selectedTargets);
  return [...document.querySelectorAll("#classes .classBox")].filter(item=>{
    const checkbox=item.querySelector(`.audioCheck[data-mode="${mode}"]`);
    return selectedSet.has(item.dataset.label)&&checkbox&&checkbox.checked;
  }).map(item=>item.dataset.label);
}

async function createTeachingModeQR(){
  updateLabelsFromDOM();

  if(!teachingTitle){
    status("teachQRStatus","請輸入教學名稱。","err");
    return;
  }
  if(!user){
    status("teachQRStatus","請先登入教師帳號。","err");
    return;
  }

  if(!model||!modelURL||!labels.length){
    status("teachQRStatus","請先成功載入 Teachable Machine Image Model。","err");
    return;
  }

  const baseInput="";
  const baseURL=baseInput||new URL("student.html",location.href).toString();

  $("createTeachQRBtn").disabled=true;
  status("teachQRStatus","正在建立學生教學模式…");

  try{
    const ref=await db.collection("tasks").add({
      teacherId:user.uid,
      teacherEmail:user.email||"",
      title:teachingTitle,
      modelURL:modelURL,
      targetClasses:[...labels],

      classThumbnails:getClassThumbnails(false),

      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });

    u.searchParams.set("task",ref.id);
    u.searchParams.set("mode","teaching");

  }finally{
    $("createTeachQRBtn").disabled=false;
  }

async function createAdvancedEvaluationQR(){
  updateLabelsFromDOM();

  const title=$("advancedTitle").value.trim();

    status("advancedStatus","請輸入進階評量名稱。","err");
    return;
  }
  if(!targets.length){
    status("advancedStatus","請至少勾選一項物品。","err");
    return;
  }

  const descriptions=getClassDescriptions(true);
  const audioRequiredClasses=getAudioTargets("advanced",targets);
  const missingDescriptions=targets.filter(name=>!String(descriptions[name]||"").trim());
  if(missingDescriptions.length){
    status(
      "advancedStatus",
      "進階評量必須設定每個物品的說明文字：\n"+missingDescriptions.join("、"),
      "err"
    );
    return;
  }

  $("createAdvancedBtn").disabled=true;
  status("advancedStatus","正在建立進階評量…");

  try{
    const ref=await db.collection("tasks").add({
      teacherId:user.uid,
      teacherEmail:user.email||"",
      title,
      modelURL,
      targetClasses:targets,
      classDescriptions:descriptions,
      classThumbnails:getClassThumbnails(true),
      audioRequiredClasses,
      speechRecognitionMode:"browser",
      speechRecognitionLanguage:"zh-TW",
      threshold:0.85,
      requiredConsecutiveFrames:1,
      orderMode:"fixed",
      taskMode:"advanced",
      status:"active",
      version:"2.5-advanced-browser-speech",
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });

    status(
      "advancedStatus",
      "進階評量建立成功！\nTask ID："+ref.id,

    );

  }finally{
    $("createAdvancedBtn").disabled=false;
  }
}

$("createAdvancedBtn").onclick=createAdvancedEvaluationQR;
